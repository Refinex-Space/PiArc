# Codex project config, the counterpart of .claude/. Codex loads it only after the project is trusted.
# Project instructions live in AGENTS.md, shared with Claude Code (each CLAUDE.md only imports it).
# Root AGENTS.md plus one module AGENTS.md exceed the 32 KiB default, so the limit is raised.
project_doc_max_bytes = 65536

# Codex-only notes. Claude Code never sees this, so the shared AGENTS.md stays tool-neutral.
developer_instructions = """
本仓库在 Codex 中的用法（与 Claude Code 的 .claude/ 等效）：
- 子目录的 AGENTS.md 只在从该目录启动时自动加载：读写某个目录下的文件前，先读该目录及上级目录里还没读过的 AGENTS.md。CLAUDE.md 只是给 Claude Code 的导入入口，不用读。
- .claude/rules/ 的规则按路径生效，Codex 不会自动加载。改 crates/** 前读 .claude/rules/rust.md；改 apps/**、agent-host/**、packages/**、scripts/** 前读 .claude/rules/typescript.md；改 docs/**/*.md、任何 AGENTS.md、README*.md 前读 .claude/rules/docs.md。
- 需要用户做决定时，在回复里列出编号选项并停下等待。
- packages/protocol/src/generated/ 是生成物，只能经 npm run gen:protocol 更新，不手改。
- 用户授权后可以普通推送到指定远端与分支。不做强制推送、改写已推送历史这类破坏性 Git 操作。
"""
