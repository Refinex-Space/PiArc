<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">PiArc architecture</title>
        <desc id="architecture-desc">The Electron app holds the React renderer, the main process and the Rust PiArc Core; Core talks to one Agent Host per workspace over AHP, the Agent Host calls the model providers, and only Core touches your files and processes.</desc>
        <defs>
      <style>#architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5d626c"/></marker>
          <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3049b8"/></marker>
          <marker id="architecture-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#3049b8"/></marker>
        </defs>

        <!-- Zones -->
        <rect x="40" y="40" width="400" height="460" rx="8" fill="#1d2027" stroke="#1d2027" stroke-width="0.8" fill-opacity="0.025" stroke-opacity="0.14"/>
        <rect x="160" y="44" width="160" height="16" rx="2" fill="#f9f9f9"/>
        <text x="240" y="56" fill="#5d626c" font-size="9" font-weight="500" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">PIARC · ELECTRON</text>

        <rect x="540" y="328" width="380" height="172" rx="8" fill="#1d2027" stroke="#1d2027" stroke-width="0.8" stroke-dasharray="4,3" fill-opacity="0.025" stroke-opacity="0.14"/>
        <rect x="552" y="332" width="168" height="16" rx="2" fill="#f9f9f9"/>
        <text x="636" y="344" fill="#5d626c" font-size="9" font-weight="500" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">ONE PER WORKSPACE</text>

        <!-- Arrows (before nodes) -->
        <line x1="240" y1="160" x2="240" y2="223" stroke="#5d626c" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <rect x="252" y="185" width="36" height="14" rx="2" fill="#f9f9f9"/>
        <text x="270" y="195" fill="#5d626c" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">IPC</text>

        <line x1="240" y1="296" x2="240" y2="359" stroke="#5d626c" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <rect x="252" y="321" width="64" height="14" rx="2" fill="#f9f9f9"/>
        <text x="284" y="331" fill="#5d626c" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">NAPI-RS</text>

        <line x1="391" y1="408" x2="589" y2="408" stroke="#3049b8" stroke-width="1.6" marker-start="url(#architecture-arrow-accent-start)" marker-end="url(#architecture-arrow-accent)"/>
        <rect x="444" y="380" width="92" height="14" rx="2" fill="#ffffff"/>
        <text x="490" y="390" fill="#3049b8" font-size="10" font-weight="500" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">AHP · STDIO</text>

        <line x1="740" y1="360" x2="740" y2="161" stroke="#5d626c" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <rect x="752" y="253" width="48" height="14" rx="2" fill="#ffffff"/>
        <text x="776" y="263" fill="#5d626c" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

        <line x1="240" y1="456" x2="240" y2="551" stroke="#5d626c" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <rect x="252" y="517" width="68" height="14" rx="2" fill="#ffffff"/>
        <text x="286" y="527" fill="#5d626c" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">TOOL I/O</text>

        <!-- Nodes -->
        <!-- Renderer -->
        <rect x="90" y="88" width="300" height="72" rx="6" fill="#ffffff"/>
        <rect x="90" y="88" width="300" height="72" rx="6" fill="#ffffff" stroke="#1d2027" stroke-width="1" stroke-opacity="0.32"/>
        <rect x="98" y="96" width="24" height="14" rx="2" fill="none" stroke="#5d626c" stroke-width="0.8" stroke-opacity="0.45"/>
        <text x="110" y="106" fill="#5d626c" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="240" y="122" fill="#1d2027" font-size="15" font-weight="600" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" text-anchor="middle">Renderer</text>
        <text x="240" y="142" fill="#5d626c" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">React · TypeScript · sandboxed</text>

        <!-- Main process -->
        <rect x="90" y="224" width="300" height="72" rx="6" fill="#ffffff"/>
        <rect x="90" y="224" width="300" height="72" rx="6" fill="#ffffff" stroke="#1d2027" stroke-width="1" stroke-opacity="0.32"/>
        <rect x="98" y="232" width="36" height="14" rx="2" fill="none" stroke="#5d626c" stroke-width="0.8" stroke-opacity="0.45"/>
        <text x="116" y="242" fill="#5d626c" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">MAIN</text>
        <text x="240" y="258" fill="#1d2027" font-size="15" font-weight="600" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" text-anchor="middle">Main process</text>
        <text x="240" y="278" fill="#5d626c" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">windows · menus · updates · relay</text>

        <!-- PiArc Core (focal) -->
        <rect x="90" y="360" width="300" height="96" rx="6" fill="#ffffff"/>
        <rect x="90" y="360" width="300" height="96" rx="6" fill="#3049b8" stroke="#3049b8" stroke-width="1.4" fill-opacity="0.06"/>
        <rect x="98" y="368" width="36" height="14" rx="2" fill="none" stroke="#3049b8" stroke-width="0.8" stroke-opacity="0.55"/>
        <text x="116" y="378" fill="#3049b8" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="240" y="400" fill="#1d2027" font-size="15" font-weight="600" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" text-anchor="middle">PiArc Core</text>
        <text x="240" y="420" fill="#5d626c" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">Rust · native module</text>
        <text x="240" y="438" fill="#5d626c" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">permissions · hooks · snapshots · vault</text>

        <!-- Agent Host -->
        <rect x="590" y="360" width="300" height="96" rx="6" fill="#ffffff"/>
        <rect x="590" y="360" width="300" height="96" rx="6" fill="#ffffff" stroke="#1d2027" stroke-width="1" stroke-opacity="0.32"/>
        <rect x="598" y="368" width="36" height="14" rx="2" fill="none" stroke="#5d626c" stroke-width="0.8" stroke-opacity="0.45"/>
        <text x="616" y="378" fill="#5d626c" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
        <text x="740" y="400" fill="#1d2027" font-size="15" font-weight="600" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" text-anchor="middle">Agent Host</text>
        <text x="740" y="420" fill="#5d626c" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">Node · Pi SDK + Harness Kit</text>
        <text x="740" y="438" fill="#5d626c" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">agent loop · context · subagents · MCP</text>

        <!-- Model providers (external) -->
        <rect x="590" y="88" width="300" height="72" rx="6" fill="#ffffff"/>
        <rect x="590" y="88" width="300" height="72" rx="6" fill="#ffffff" stroke="#1d2027" stroke-width="1" stroke-dasharray="5,4" stroke-opacity="0.32"/>
        <rect x="598" y="96" width="32" height="14" rx="2" fill="none" stroke="#5d626c" stroke-width="0.8" stroke-opacity="0.45"/>
        <text x="614" y="106" fill="#5d626c" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="740" y="122" fill="#1d2027" font-size="15" font-weight="600" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" text-anchor="middle">Model providers</text>
        <text x="740" y="142" fill="#5d626c" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">Anthropic · OpenAI · DeepSeek · local</text>

        <!-- Your files and processes (external) -->
        <rect x="90" y="552" width="300" height="72" rx="6" fill="#ffffff"/>
        <rect x="90" y="552" width="300" height="72" rx="6" fill="#ffffff" stroke="#1d2027" stroke-width="1" stroke-dasharray="5,4" stroke-opacity="0.32"/>
        <rect x="98" y="560" width="24" height="14" rx="2" fill="none" stroke="#5d626c" stroke-width="0.8" stroke-opacity="0.45"/>
        <text x="110" y="570" fill="#5d626c" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">OS</text>
        <text x="240" y="586" fill="#1d2027" font-size="15" font-weight="600" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" text-anchor="middle">Your machine</text>
        <text x="240" y="606" fill="#5d626c" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">files · shell · git · terminal</text>

        <!-- Legend -->
        <line x1="40" y1="648" x2="920" y2="648" stroke="#1d2027" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="668" fill="#5d626c" font-size="9" font-weight="500" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="128" y="658" width="20" height="12" rx="2" fill="#3049b8" stroke="#3049b8" stroke-width="1.2" fill-opacity="0.06"/>
        <text x="156" y="668" fill="#1d2027" font-size="11" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">Control plane: every file, command and approval goes through Core</text>
        <rect x="592" y="658" width="20" height="12" rx="2" fill="none" stroke="#1d2027" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.32"/>
        <text x="620" y="668" fill="#1d2027" font-size="11" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">Outside PiArc</text>
      </svg>
