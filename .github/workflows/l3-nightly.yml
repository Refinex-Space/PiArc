name: L3 Nightly

# L3 behavior alignment (architecture sections 12.1, 12.5 and 13.3; docs/engineering/testing.md
# section 14): PiArc and a pinned Claude Code run the same scenarios against the local strict
# mock provider, and `npm run l3` compares what they did. Separate from PR CI.
#
# No secrets: Claude Code gets a fake API key from scripts/l3/claude-side.mjs and only ever talks
# to the mock on 127.0.0.1. Raising CLAUDE_CODE_VERSION may bring new differences: fix them or
# record them in tests/l3-allowlist.yaml (entries carry a Claude Code version range).

on:
  schedule:
    - cron: '30 18 * * *' # 02:30 Beijing time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CLAUDE_CODE_VERSION: '2.1.318'

jobs:
  l3:
    name: L3 (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Cache the libghostty-vt artefacts (build.rs verifies them on every use)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/cache/ghostty-vt
          key: ghostty-vt-${{ github.job }}-macos-latest-${{ hashFiles('crates/piarc-ghostty-sys/ghostty-vt.lock.json') }}

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Install the pinned Claude Code
        # The npm package brings the native binary as a platform optional dependency.
        run: |
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: Run L3 (each side twice)
        env:
          DISABLE_AUTOUPDATER: '1'
        run: npm run l3 -- --repeat 2

      - name: Upload the L3 report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l3-report
          path: |
            tmp/l3/report.md
            tmp/l3/results.json
            tmp/l3/recordings/
          if-no-files-found: warn
