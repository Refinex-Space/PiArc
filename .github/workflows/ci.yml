name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64; windows-latest is x64.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Cache repository-local tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/dev/install-tools.mjs', 'rust-toolchain.toml') }}

      - name: Install pinned tools (cargo-deny)
        run: node scripts/dev/install-tools.mjs

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Verify
        run: npm run verify

  desktop:
    # L4 tests and the fuse check need a packaged Electron app (docs/engineering/testing.md, L4).
    name: desktop L4 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PIARC_EVIDENCE_TASK: ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Download the Electron binary (skipped by --ignore-scripts)
        run: node node_modules/electron/install.js

      - name: Package the development flavor
        run: npm run package:desktop -- --flavor development

      - name: L4 smoke and security tests (dev form and packaged app)
        run: npm run test:e2e -w @piarc/desktop

      - name: Package the release flavor
        run: npm run package:desktop -- --flavor release

      - name: Check the fuses of the release package
        run: npm run check:fuses

      - name: Upload L4 evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l4-evidence-${{ matrix.os }}
          path: tmp/evidence/ci
          if-no-files-found: ignore
