name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64; windows-latest is x64.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Cache repository-local tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/dev/install-tools.mjs', 'rust-toolchain.toml') }}

      - name: Cache the libghostty-vt artefacts (build.rs verifies them on every use)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/cache/ghostty-vt
          key: ghostty-vt-${{ github.job }}-${{ matrix.os }}-${{ hashFiles('crates/piarc-ghostty-sys/ghostty-vt.lock.json') }}

      - name: Install pinned tools (cargo-deny, cargo-audit, ripgrep, fd, bindgen-cli)
        run: node scripts/dev/install-tools.mjs

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Verify
        run: npm run verify

      - name: Upload the L2 report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l2-report-${{ matrix.os }}
          path: target/l2/results.json
          if-no-files-found: ignore

  desktop:
    # L4 tests and the fuse check need a packaged Electron app (docs/engineering/testing.md, L4).
    name: desktop L4 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PIARC_EVIDENCE_TASK: ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Cache the libghostty-vt artefacts (build.rs verifies them on every use)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/cache/ghostty-vt
          key: ghostty-vt-${{ github.job }}-${{ matrix.os }}-${{ hashFiles('crates/piarc-ghostty-sys/ghostty-vt.lock.json') }}

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Download the Electron binary (skipped by --ignore-scripts)
        run: node node_modules/electron/install.js

      # package:desktop builds the Core module of the flavor before packaging.
      - name: Package the development flavor
        run: npm run package:desktop -- --flavor development

      - name: L4 smoke and security tests (dev form and packaged app)
        run: npm run test:e2e -w @piarc/desktop

      # T44: the PR subset of chapter 11, three-run medians, judged against this runner class's
      # baseline in scripts/perf/baselines/ (hosted runners are not the reference machines, so
      # the absolute budgets are checked on those, not here).
      - name: Performance smoke
        run: node scripts/perf/run.mjs --lane pr --runs 3

      - name: Upload the performance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-pr-${{ matrix.os }}
          path: tmp/perf/pr/report.json
          if-no-files-found: ignore

      - name: Package the release flavor
        run: npm run package:desktop -- --flavor release

      - name: Check the fuses of the release package
        run: npm run check:fuses

      - name: Upload L4 evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l4-evidence-${{ matrix.os }}
          path: tmp/evidence/ci
          if-no-files-found: ignore

  core-build:
    # The four prebuilt Core modules (ADR-0014). Both macOS targets build on Apple silicon,
    # both Windows targets on x64 with MSVC (docs/research/electron-stack.md section 4).
    # Each links libghostty-vt: the static library on macOS, the import library of the
    # official DLL on Windows, which is uploaded next to the module (ADR-0017, S7 report).
    name: core build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust toolchain and the ${{ matrix.target }} target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustup show

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Cache the libghostty-vt artefacts (build.rs verifies them on every use)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/cache/ghostty-vt
          key: ghostty-vt-${{ github.job }}-${{ matrix.target || matrix.os }}-${{ hashFiles('crates/piarc-ghostty-sys/ghostty-vt.lock.json') }}

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build both flavors for ${{ matrix.target }}
        run: node scripts/dev/build-core.mjs --flavor all --target ${{ matrix.target }}

      - name: Upload the modules
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-${{ matrix.target }}
          # Windows modules import ghostty-vt.dll from their own directory (ADR-0017).
          path: |
            target/piarc-core/*/*.node
            target/piarc-core/*/*.dll
          if-no-files-found: error

  core-load:
    # Loads each prebuilt module on a runner of its own architecture, in Node and in Electron,
    # and runs the event channel once (scripts/ci/load-core.mjs).
    name: core load (${{ matrix.target }})
    needs: core-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, module: piarc-core.darwin-arm64.node }
          - { target: x86_64-apple-darwin, os: macos-15-intel, module: piarc-core.darwin-x64.node }
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-latest,
              module: piarc-core.win32-x64-msvc.node,
            }
          - {
              target: aarch64-pc-windows-msvc,
              os: windows-11-arm,
              module: piarc-core.win32-arm64-msvc.node,
            }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Download the Electron binary for this runner
        run: node node_modules/electron/install.js

      - name: Download the modules
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-${{ matrix.target }}
          path: core-modules

      - name: Load and run the development and release builds
        run: >-
          node scripts/ci/load-core.mjs
          --module core-modules/development/${{ matrix.module }}
          --module core-modules/release/${{ matrix.module }}

  package-macos:
    # S6 (T12): release DMG and ZIP of both architectures, signed in layers (node keeps the
    # Node.js Foundation signature), with the fuse and layout/signature checks.
    name: package macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, target: aarch64-apple-darwin }
          - { arch: x64, target: x86_64-apple-darwin }
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust toolchain and the ${{ matrix.target }} target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustup show

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: package-${{ matrix.target }}

      - name: Cache the libghostty-vt artefacts (build.rs verifies them on every use)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/cache/ghostty-vt
          key: ghostty-vt-${{ github.job }}-${{ matrix.target }}-${{ hashFiles('crates/piarc-ghostty-sys/ghostty-vt.lock.json') }}

      - name: Cache the bundled node, rg and fd (fetch-binaries.mjs verifies them on every use)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/cache/binaries
          key: binaries-${{ github.job }}-${{ matrix.arch }}-${{ hashFiles('third-party/binaries.lock.json') }}

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Package and make the release flavor (DMG and ZIP)
        run: npm run package:desktop -- --flavor release --arch ${{ matrix.arch }} --make

      - name: Check the fuses
        run: npm run check:fuses -- --arch ${{ matrix.arch }}

      - name: Check the layout and the signing layers
        run: node scripts/ci/check-app-layout.mjs --flavor release --arch ${{ matrix.arch }}

      - name: Upload the DMG and ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: piarc-macos-${{ matrix.arch }}
          path: |
            apps/desktop/out/release/make/dmg/${{ matrix.arch }}/*.dmg
            apps/desktop/out/release/make/zip/darwin/${{ matrix.arch }}/*.zip
          if-no-files-found: error

  package-windows:
    # S6 (T12): Velopack installers (per-user, unsigned, ADR-0018 rule 3) for both
    # architectures, two adjacent versions in one release feed so W0 can check updates. The
    # development flavor carries the test entry W0 uses for its mock conversation. Both
    # architectures build on x64 (the arm64 Core module is cross-compiled with MSVC).
    name: package Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust toolchain and the ${{ matrix.target }} target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustup show

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: package-${{ matrix.target }}

      - name: Cache the libghostty-vt artefacts (build.rs verifies them on every use)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/cache/ghostty-vt
          key: ghostty-vt-${{ github.job }}-${{ matrix.target }}-${{ hashFiles('crates/piarc-ghostty-sys/ghostty-vt.lock.json') }}

      - name: Cache the bundled node, rg, fd and vpk (fetch-binaries.mjs verifies them on every use)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/cache/binaries
          key: binaries-${{ github.job }}-${{ matrix.arch }}-${{ hashFiles('third-party/binaries.lock.json') }}

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Package the development flavor
        run: npm run package:desktop -- --flavor development --arch ${{ matrix.arch }}

      - name: Check the fuses
        run: npm run check:fuses -- --flavor development --arch ${{ matrix.arch }}

      - name: Check the layout
        run: node scripts/ci/check-app-layout.mjs --flavor development --arch ${{ matrix.arch }}

      # vpk is a .NET tool: the runner's .NET SDK installs the locked nupkg into .tools/vpk/.
      - name: Build Velopack installers 0.0.1 and 0.0.2
        run: >-
          node scripts/release/pack-windows.mjs
          --arch ${{ matrix.arch }} --flavor development --versions 0.0.1,0.0.2

      - name: Upload the Velopack release feed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: piarc-windows-${{ matrix.arch }}-velopack
          path: apps/desktop/out/development/velopack/win32-${{ matrix.arch }}
          if-no-files-found: error
