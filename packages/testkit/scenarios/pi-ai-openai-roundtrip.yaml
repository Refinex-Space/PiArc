# pi-ai round trip over OpenAI-compatible Chat Completions
# (packages/testkit/src/pi-ai-roundtrip.test.ts).
id: pi-ai-openai-roundtrip
validation:
  required_system_sections: ['<piarc-test-environment>']
steps:
  - text: 'I will read the file.'
    tool_calls:
      - id: call_pi_ai_1
        name: read_file
        input: { path: 'dir with space/中文.txt', encoding: 'utf-8' }
        fragments: 4
    usage: { input_tokens: 50, output_tokens: 20, cache_read_tokens: 10 }
  - text: 'The file says hello.'
    usage: { input_tokens: 70, output_tokens: 8 }
