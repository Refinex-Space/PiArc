[package]
name = "piarc-core"
description = "Runtime facade: workspace and session orchestration, event bus, incremental merging, background task registry."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Development builds only (piarc-napi's `testing`): the WAV file audio source of dictation.
testing = ["piarc-speech/testing"]

[dependencies]
base64.workspace = true
getrandom.workspace = true
http.workspace = true
jsonschema.workspace = true
minisign-verify.workspace = true
piarc-browser-import.workspace = true
piarc-checkpoint.workspace = true
piarc-config.workspace = true
piarc-diff.workspace = true
piarc-exec.workspace = true
piarc-fs.workspace = true
piarc-git.workspace = true
piarc-host.workspace = true
piarc-policy.workspace = true
piarc-hooks.workspace = true
piarc-ports.workspace = true
piarc-protocol.workspace = true
piarc-sandbox.workspace = true
piarc-secrets.workspace = true
piarc-speech.workspace = true
piarc-store.workspace = true
piarc-telemetry.workspace = true
piarc-term.workspace = true
piarc-web.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

unicode-normalization.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Managed preferences (T47): the property list files of /Library/Managed Preferences, and the
# login user's name from the account database for the user channel's file.
nix = { workspace = true, features = ["user"] }
plist.workspace = true

[target.'cfg(windows)'.dependencies]
# Managed settings (T47): the HKLM policy key and the Program Files directory.
windows-registry.workspace = true

[dev-dependencies]
encoding_rs.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
