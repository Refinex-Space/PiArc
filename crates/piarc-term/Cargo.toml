[package]
name = "piarc-term"
description = "Terminal sessions: PTY (portable-pty) plus libghostty-vt terminal state, screen snapshots (ADR-0017)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
piarc-ghostty-sys.workspace = true
piarc-protocol.workspace = true
portable-pty.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
# Clears the inherited ignore-Ctrl+C flag before starting programs (the `console` module).
windows-sys = { workspace = true, features = ["Win32_System_Console"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
