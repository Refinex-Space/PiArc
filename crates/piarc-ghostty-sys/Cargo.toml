[package]
name = "piarc-ghostty-sys"
description = "libghostty-vt -sys layer: committed bindgen bindings, download and verification of official prebuilt artefacts (ADR-0017)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
# One crate links libghostty-vt; dependents read DEP_GHOSTTY_VT_INCLUDE, _ROOT and (Windows) _DLL.
links = "ghostty-vt"
build = "build.rs"

[build-dependencies]
