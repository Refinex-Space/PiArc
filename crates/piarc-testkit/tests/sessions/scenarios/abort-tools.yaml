# T14-A05: the abort comes while the first call runs; the other two wait for their batch. Every
# rule is on for the request after the interruption (tool_pairing and role_order included).
id: abort-tools
steps:
  - tool_calls:
      - { id: toolu_hang, name: Bash, input: { command: "sleep 30" } }
      - { id: toolu_read, name: Read, input: { path: "notes/a.txt" } }
      - { id: toolu_grep, name: Grep, input: { pattern: "alpha" } }
  - text: "Answered after the interruption."
