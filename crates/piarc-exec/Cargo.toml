[package]
name = "piarc-exec"
description = "Process management (process groups / Job Object, implements ProcessSpawner) and shell commands: timeouts, output spooling, exit code meaning, environment, working directory."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
piarc-ports.workspace = true
piarc-protocol.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
tokio-util.workspace = true

[target.'cfg(unix)'.dependencies]
# killpg for ProcessTreeSpawner, without unsafe code in this crate.
nix = { workspace = true, features = ["signal"] }

[target.'cfg(windows)'.dependencies]
# Job Objects for ProcessTreeSpawner (the `job` module is this crate's only unsafe code).
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
# `test-util` pauses tokio's clock: timeouts of minutes run instantly (T17-A04).
tokio = { workspace = true, features = ["process", "io-util", "test-util"] }

[lints]
workspace = true
