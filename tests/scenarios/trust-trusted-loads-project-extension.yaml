id: trust-trusted-loads-project-extension
description: Once Core trusts the workspace, the project's Pi extension loads, its tool is offered next to the canonical ones, and a call to it runs.
capabilities: [CAP-TRUST-PROJECT-001, CAP-EXT-PI-001]
workspace:
  trusted: true
  files:
    '.pi/extensions/probe-tool.ts': |
      export default function (pi: any) {
        pi.registerTool({
          name: 'fixture_probe',
          label: 'Fixture probe',
          description: 'Registered by the project extension fixture.',
          parameters: { type: 'object', properties: {}, additionalProperties: false },
          async execute() {
            return { content: [{ type: 'text', text: 'probe answered' }], details: {} };
          },
        });
      }
providers:
  main:
    wire: anthropic
    steps:
      - tool_calls:
          - { id: toolu_probe, name: fixture_probe, input: {} }
      - text: 'The probe answered.'
actions:
  - prompt: { text: 'Call the probe.', turn: t }
expect:
  events:
    - {
        method: item/completed,
        params: { item: { itemId: toolu_probe, tool: fixture_probe, status: completed } },
      }
    - { method: turn/completed, turn: t, params: { status: completed } }
  requests:
    - { index: 0, tools: [Read, Write, Edit, Bash, Glob, Grep, fixture_probe] }
    - { index: 1, tool_results: [{ id: toolu_probe, is_error: false, contains: probe answered }] }
