id: exec-env-internal-vars
description: Commands inherit the user's locale, while exported test credentials and internal runtime settings stay out.
capabilities: [CAP-EXEC-ENV-001]
providers:
  main:
    wire: anthropic
    steps:
      - tool_calls:
          - { id: toolu_env, name: Bash, input: { command: 'env' } }
      - text: 'Listed.'
approvals:
  - { tool: Bash, decision: allow }
actions:
  - prompt: { text: 'Show the environment.', turn: t }
expect:
  events:
    - { method: item/completed, params: { item: { itemId: toolu_env, status: completed } } }
    - { method: turn/completed, turn: t, params: { status: completed } }
  requests:
    - index: 1
      tool_results:
        - { id: toolu_env, is_error: false, contains: 'LC_NUMERIC=C' }
      not_contains:
        - 'ELECTRON_RUN_AS_NODE'
        - 'synthetic-exported-secret'
        - 'L2_USER_VAR='
        - 'NODE_OPTIONS'
        - 'PI_CODING_AGENT_DIR'
        - 'PIARC_L2_INTERNAL'
        - 'piarc-mock-test-key'
  request_counts: { main: 2 }
