id: sec-malicious-repo-new-item
description: THR-02. The same repository once trusted runs its configuration (hooks, the MCP server, the extension, the plugin, the allow rule); a hook and an MCP server added to its files afterwards make the project untrusted until the user confirms again, so neither the new nor the old project items run in the next turn and the allow rule asks again.
capabilities: [CAP-SEC-MALICIOUS-REPO-001]
workspace:
  trusted: true
  fixtures:
    hook.mjs: hooks/hook.mjs.txt
  files:
    README.md: "# Totally harmless\n"
    .piarc/settings.json: |
      {
        "hooks": {"UserPromptSubmit": [{"hooks": [{"type": "command", "command": "node hook.mjs piarc"}]}]},
        "permissions": {"allow": ["Bash(sed *)"]}
      }
    .claude/settings.json: |
      {
        "hooks": {"PreToolUse": [{"matcher": "Bash", "hooks": [{"type": "command", "command": "node hook.mjs claude"}]}]},
        "permissions": {"allow": ["Bash(sed *)"]}
      }
    .mcp.json: '{"mcpServers":{"repo":{"command":"node","args":["{{mcp_echo}}","repo"],"env":{"MCP_ECHO_START_LOG":"{{workspace}}/mcp-started.jsonl"}}}}'
    .pi/extensions/probe.ts: |
      export default function (pi: any) {
        pi.registerTool({
          name: 'repo_probe',
          label: 'Repository probe',
          description: 'Registered by the repository extension.',
          parameters: { type: 'object', properties: {}, additionalProperties: false },
          async execute() {
            return { content: [{ type: 'text', text: 'probe' }], details: {} };
          },
        });
      }
    .pi/settings.json: '{"extensions": ["../vendor/pi-ext/ext.ts"], "packages": ["{{workspace}}/vendor/pi-pkg"]}'
    vendor/pi-ext/ext.ts: |
      export default function (pi: any) {
        pi.registerTool({
          name: 'settings_extension_probe',
          label: 'Settings extension probe',
          description: 'Registered by an extension named in .pi/settings.json.',
          parameters: { type: 'object', properties: {}, additionalProperties: false },
          async execute() {
            return { content: [{ type: 'text', text: 'probe' }], details: {} };
          },
        });
      }
    vendor/pi-pkg/package.json: '{"name": "pi-pkg", "pi": {"extensions": ["./probe.ts"]}}'
    vendor/pi-pkg/probe.ts: |
      export default function (pi: any) {
        pi.registerTool({
          name: 'settings_package_probe',
          label: 'Settings package probe',
          description: 'Registered by a package named in .pi/settings.json.',
          parameters: { type: 'object', properties: {}, additionalProperties: false },
          async execute() {
            return { content: [{ type: 'text', text: 'probe' }], details: {} };
          },
        });
      }
  run_files:
    pkgs/demo/.claude-plugin/plugin.json: '{"name": "demo"}'
    pkgs/demo/hooks/hooks.json: '{"hooks": {"UserPromptSubmit": [{"hooks": [{"type": "command", "command": "node -e \"process.stdout.write(String.fromCharCode(72,79,79,75))\""}]}]}}'
    pkgs/demo/.mcp.json: '{"mcpServers":{"echo":{"command":"node","args":["{{mcp_echo}}","demo"],"env":{"MCP_ECHO_START_LOG":"{{workspace}}/plugin-mcp-started.jsonl"}}}}'
    pkgs/pi-demo/package.json: '{"name": "pi-demo", "pi": {"extensions": ["./probe.ts"]}}'
    pkgs/pi-demo/probe.ts: |
      export default function (pi: any) {
        pi.registerTool({
          name: 'package_probe',
          label: 'Package probe',
          description: 'Registered by the pi-demo package.',
          parameters: { type: 'object', properties: {}, additionalProperties: false },
          async execute() {
            return { content: [{ type: 'text', text: 'probe' }], details: {} };
          },
        });
      }
packages:
  - { path: pkgs/demo, scope: project }
  - { path: pkgs/pi-demo, scope: project }
providers:
  main:
    wire: anthropic
    steps:
      - tool_calls:
          - { id: sed1, name: Bash, input: { command: 'sed -n 1p README.md' } }
      - text: First line shown.
      - tool_calls:
          - { id: sed2, name: Bash, input: { command: 'sed -n 1p README.md' } }
      - text: Asked this time.
actions:
  - prompt: { text: Show the first line of the README., turn: one }
  - wait: { method: turn/completed, turn: one }
  - write_file:
      path: .piarc/settings.json
      content: |
        {
          "hooks": {"UserPromptSubmit": [
            {"hooks": [{"type": "command", "command": "node hook.mjs piarc"}]},
            {"hooks": [{"type": "command", "command": "node hook.mjs added"}]}
          ]},
          "permissions": {"allow": ["Bash(sed *)"]},
          "plugins": {"demo": true, "pi-demo": true}
        }
  - write_file:
      path: .mcp.json
      content: '{"mcpServers":{"repo":{"command":"node","args":["{{mcp_echo}}","repo"],"env":{"MCP_ECHO_START_LOG":"{{workspace}}/mcp-started.jsonl"}},"added":{"command":"node","args":["{{mcp_echo}}","added"],"env":{"MCP_ECHO_START_LOG":"{{workspace}}/added-mcp-started.jsonl"}}}}'
  - check_trust:
      fields:
        trusted: false
        decision: trusted
  - prompt: { text: Once more., turn: two }
approvals:
  - { tool: Bash, kind: command, decision: deny }
expect:
  request_counts: { main: 4 }
  requests:
    - index: 0
      tools_include: [repo_probe, package_probe, mcp__repo__echo, mcp__plugin_demo_echo__echo]
      tools_exclude: [settings_package_probe]
      contains: [HOOK]
    - index: 1
      tool_results:
        - { id: sed1, is_error: false, contains: Totally harmless }
    - index: 3
      tool_results:
        - { id: sed1, is_error: false }
        - { id: sed2, is_error: true }
  files:
    hook-log/added.jsonl: null
    added-mcp-started.jsonl: null
  json_lines:
    hook-log/piarc.jsonl:
      - input: { hook_event_name: UserPromptSubmit }
    hook-log/claude.jsonl:
      - input: { hook_event_name: PreToolUse, tool_name: Bash }
