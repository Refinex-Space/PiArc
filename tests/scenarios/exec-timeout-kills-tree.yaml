id: exec-timeout-kills-tree
description: A command that outlives its timeout is stopped together with its child and grandchild; the model gets the output printed so far and the timeout, and a later command finds both processes gone.
capabilities: [CAP-EXEC-TIMEOUT-001, CAP-TOOL-BASH-002]
providers:
  main:
    wire: anthropic
    steps:
      - tool_calls:
          - id: toolu_tree
            name: Bash
            input:
              timeout: 2
              command: >-
                bash -c 'sleep 60 & echo $! > grand.pid; wait' & echo $! > child.pid;
                while [ ! -s grand.pid ]; do sleep 0.05; done; echo started; wait
      - tool_calls:
          - id: toolu_check
            name: Bash
            input:
              command: >-
                for f in child.pid grand.pid; do p=$(cat $f);
                for i in $(seq 1 25); do kill -0 $p 2>/dev/null || break; sleep 0.2; done;
                if kill -0 $p 2>/dev/null; then echo "running:$f"; else echo "ended:$f"; fi; done
      - text: 'Checked.'
actions:
  - prompt: { text: 'Start the tree.', turn: t }
expect:
  events:
    - method: item/completed
      params:
        item:
          itemId: toolu_tree
          type: commandExecution
          status: failed
          execution: { timedOut: true, timeoutMs: 2000, outcome: failure }
    - { method: item/completed, params: { item: { itemId: toolu_check, status: completed } } }
    - { method: turn/completed, turn: t, params: { status: completed } }
  requests:
    - index: 1
      tool_results:
        - { id: toolu_tree, is_error: true, contains: "started\n\n\nCommand timed out after 2 seconds" }
    - index: 2
      contains: ['ended:child.pid', 'ended:grand.pid']
      not_contains: ['running:child.pid', 'running:grand.pid']
  request_counts: { main: 3 }
