id: exec-timeout-kills-tree
description: A command that outlives its timeout keeps running as a background task instead of being stopped (T32, replacing T17's stop); KillShell then stops it with its child and grandchild, and a later command finds both processes gone.
capabilities: [CAP-EXEC-TIMEOUT-001, CAP-TOOL-BASH-002, CAP-BG-KILL-001]
providers:
  main:
    wire: anthropic
    steps:
      - tool_calls:
          - id: toolu_tree
            name: Bash
            input:
              timeout: 2
              command: >-
                bash -c 'sleep 60 & echo $! > grand.pid; wait' & echo $! > child.pid;
                while [ ! -s grand.pid ]; do sleep 0.05; done; echo started; wait
      - tool_calls:
          - id: toolu_kill
            name: KillShell
            input: { shell_id: '{{result:toolu_tree:as task (bg-[0-9a-f]+)}}' }
      - tool_calls:
          - id: toolu_check
            name: Bash
            input:
              command: >-
                for f in child.pid grand.pid; do p=$(cat $f);
                for i in $(seq 1 25); do kill -0 $p 2>/dev/null || break; sleep 0.2; done;
                if kill -0 $p 2>/dev/null; then echo "running:$f"; else echo "ended:$f"; fi; done
      - text: 'Checked.'
approvals:
  - { tool: Bash, decision: allow }
  - { tool: Bash, decision: allow }
actions:
  - prompt: { text: 'Start the tree.', turn: t }
  # The timeout runs on the task manager's clock: move it once the command printed.
  - wait: { method: item/updated, params: { item: { itemId: toolu_tree, output: "started\n" } } }
  - advance_clock: { seconds: 2 }
  # KillShell's stop reaches the task list with what the command printed.
  - wait: { method: core/tasks, params: { kind: command, status: killed, tail: [started] } }
expect:
  events:
    - method: item/completed
      params:
        item:
          itemId: toolu_tree
          type: commandExecution
          status: completed
          execution: { timedOut: true, timeoutMs: 2000, task: { reason: timeout } }
    - { method: item/completed, params: { item: { itemId: toolu_kill, status: completed } } }
    - { method: item/completed, params: { item: { itemId: toolu_check, status: completed } } }
    - { method: turn/completed, turn: t, params: { status: completed } }
  requests:
    - index: 1
      tool_results:
        - id: toolu_tree
          is_error: false
          contains: 'still running after its timeout of 2 seconds, so it moved to the background as task bg-'
    - index: 2
      tool_results:
        - { id: toolu_tree }
        - id: toolu_kill
          is_error: false
          contains: 'was stopped together with every process it started.'
    - index: 3
      contains: ['ended:child.pid', 'ended:grand.pid']
      not_contains: ['running:child.pid', 'running:grand.pid']
  request_counts: { main: 4 }
