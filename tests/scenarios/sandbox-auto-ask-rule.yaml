id: sandbox-auto-ask-rule
description: With the sandbox's auto-approval on, a Bash ask rule still shows the card; declined, the command does not run (T39).
capabilities: [CAP-SANDBOX-AUTO-001]
platforms: [macos]
platform_reason: The command sandbox (Seatbelt) exists on macOS only (requirement D7).
workspace:
  trusted: true
  run_files:
    'data 数据/settings.json': '{"sandbox":{"enabled":true,"autoAllowBashIfSandboxed":true},"permissions":{"ask":["Bash(touch *)"]}}'
providers:
  main:
    wire: anthropic
    steps:
      - tool_calls:
          - { id: asked, name: Bash, input: { command: 'touch asked.txt' } }
      - text: Done.
approvals:
  - { tool: Bash, decision: deny, feedback: Not this one. }
actions:
  - prompt: { text: Go., turn: t }
expect:
  request_counts: { main: 2 }
  requests:
    - index: 1
      tool_results:
        - { id: asked, is_error: true, contains: Not this one. }
  files:
    asked.txt: null
