id: perm-auto-provider-error
description: A reviewer request the provider keeps rate limiting, after the session's retries, goes to the user as an approval card (T46).
capabilities: [CAP-PERM-AUTO-FALLBACK-001]
workspace:
  trusted: true
  run_files:
    'data 数据/settings.json': '{"permissions":{"enableAutoMode":true},"autoMode":{"model":"mock-rev/mock-model"}}'
providers:
  main:
    wire: anthropic
    steps:
      - tool_calls:
          - { id: cmd, name: Bash, input: { command: 'printenv HOME' } }
      - text: Stopped.
  rev:
    wire: anthropic
    strict_tools: true
    steps:
      - error: { kind: rate_limit }
      - error: { kind: rate_limit }
      - error: { kind: rate_limit }
      - error: { kind: rate_limit }
sessions:
  main: { provider: main, mode: auto }
actions:
  - prompt: { text: Print the home directory., turn: one }
approvals:
  - { tool: Bash, call: cmd, decision: deny, review: providerError }
expect:
  request_counts: { main: 2 }
  requests:
    - provider: main
      index: 1
      tool_results:
        - { id: cmd, is_error: true, contains: User denied Bash }
  events:
    - { method: turn/completed, turn: one, params: { status: completed } }
