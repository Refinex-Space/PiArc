id: hooks-archive-during-hook
description: Archiving a session right after its turn, while the turn's idle Notification hook still runs, removes the session's temporary directory once Core has let go of the session (on Windows the hook's open hold on the session refused the removal, W2).
capabilities: [CAP-HOOK-NOTIFY-001]
workspace:
  trusted: true
  fixtures:
    hook.mjs: hooks/hook.mjs.txt
  files:
    .claude/settings.json: |
      {"hooks": {"Notification": [{"hooks": [{"type": "command", "command": "node hook.mjs notify 3000"}]}]}}
providers:
  main:
    wire: anthropic
    steps:
      - text: 'Done.'
actions:
  - prompt: { text: 'Say done.', turn: t }
  - wait: { method: turn/completed, turn: t }
  - set_prefs: { archived: true }
expect:
  request_counts: { main: 1 }
