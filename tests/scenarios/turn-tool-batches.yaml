id: turn-tool-batches
description: One response with 12 reads, a write and 2 reads runs in batches of at most 10 concurrent read-only calls, with the write alone; Core sees each batch's requests together.
capabilities: [CAP-TURN-BATCH-001]
workspace:
  files:
    'files/01.txt': "file 1\n"
    'files/02.txt': "file 2\n"
    'files/03.txt': "file 3\n"
    'files/04.txt': "file 4\n"
    'files/05.txt': "file 5\n"
    'files/06.txt': "file 6\n"
    'files/07.txt': "file 7\n"
    'files/08.txt': "file 8\n"
    'files/09.txt': "file 9\n"
    'files/10.txt': "file 10\n"
    'files/11.txt': "file 11\n"
    'files/12.txt': "file 12\n"
    'files/13.txt': "file 13\n"
    'files/14.txt': "file 14\n"
providers:
  main:
    wire: anthropic
    steps:
      - tool_calls:
          - { id: r01, name: Read, input: { path: 'files/01.txt' } }
          - { id: r02, name: Read, input: { path: 'files/02.txt' } }
          - { id: r03, name: Read, input: { path: 'files/03.txt' } }
          - { id: r04, name: Read, input: { path: 'files/04.txt' } }
          - { id: r05, name: Read, input: { path: 'files/05.txt' } }
          - { id: r06, name: Read, input: { path: 'files/06.txt' } }
          - { id: r07, name: Read, input: { path: 'files/07.txt' } }
          - { id: r08, name: Read, input: { path: 'files/08.txt' } }
          - { id: r09, name: Read, input: { path: 'files/09.txt' } }
          - { id: r10, name: Read, input: { path: 'files/10.txt' } }
          - { id: r11, name: Read, input: { path: 'files/11.txt' } }
          - { id: r12, name: Read, input: { path: 'files/12.txt' } }
          - { id: w13, name: Write, input: { path: 'files/out.txt', content: "written\n" } }
          - { id: r14, name: Read, input: { path: 'files/13.txt' } }
          - { id: r15, name: Read, input: { path: 'files/14.txt' } }
      - text: 'Read and wrote everything.'
actions:
  - prompt: { text: 'Read, write, read.', turn: t }
expect:
  tool_batches:
    - [r01, r02, r03, r04, r05, r06, r07, r08, r09, r10]
    - [r11, r12]
    - [w13]
    - [r14, r15]
  events:
    - { method: turn/completed, turn: t, params: { status: completed } }
  files:
    'files/out.txt': "written\n"
  request_counts: { main: 2 }
