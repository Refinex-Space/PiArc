id: tools-search-ignore-and-limits
description: In a Git repository Grep and Glob leave out what .gitignore ignores, Grep skips binary files in a directory search, and both cut results at their limit with a note saying so.
capabilities: [CAP-TOOL-SEARCH-LIMITS-001]
workspace:
  fixtures:
    'data.bin': binary.dat
  files:
    '.git/HEAD': "ref: refs/heads/main\n"
    '.gitignore': "dist/\n*.log\n"
    'src/a.ts': "export const needle = 1;\n"
    'src/b.ts': "export const needle = 2;\n"
    'dist/out.js': "const needle = 3;\n"
    'debug.log': "needle in a log\n"
providers:
  main:
    wire: anthropic
    steps:
      - tool_calls:
          - { id: toolu_grep, name: Grep, input: { pattern: needle } }
          - { id: toolu_glob_ignored, name: Glob, input: { pattern: '*.{log,js}' } }
          - { id: toolu_grep_limit, name: Grep, input: { pattern: needle, limit: 1 } }
          - { id: toolu_glob_limit, name: Glob, input: { pattern: '*.ts', limit: 1 } }
      - text: 'Searched.'
actions:
  - prompt: { text: 'Find the needles.', turn: t }
expect:
  events:
    - { method: turn/completed, turn: t, params: { status: completed } }
  requests:
    - index: 1
      not_contains: ['dist/out.js', 'debug.log', 'data.bin']
      tool_results:
        - {
            id: toolu_grep,
            is_error: false,
            contains: "src/a.ts:1: export const needle = 1;\nsrc/b.ts:1: export const needle = 2;",
          }
        - { id: toolu_glob_ignored, is_error: false, contains: 'No files found matching pattern' }
        - {
            id: toolu_grep_limit,
            is_error: false,
            contains: "src/a.ts:1: export const needle = 1;\n\n[1 matches limit reached. Use limit=2 for more, or refine pattern]",
          }
        - { id: toolu_glob_limit, is_error: false, contains: '[1 results limit reached]' }
  request_counts: { main: 2 }
