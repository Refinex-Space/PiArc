id: tools-edit-requires-read
description: Edit and Write of an existing file the session has not read fail with an error that asks for a Read and leave the file unchanged; after a Read the same Edit succeeds, and a new file needs no Read.
capabilities: [CAP-TOOL-EDIT-READFIRST-001, CAP-TOOL-EDIT-002]
workspace:
  files:
    'src/config 配置.ts': "export const port = 8080;\n"
providers:
  main:
    wire: anthropic
    steps:
      - tool_calls:
          - {
              id: toolu_edit_unread,
              name: Edit,
              input: { path: 'src/config 配置.ts', edits: [{ oldText: '8080', newText: '9090' }] },
            }
      - tool_calls:
          - {
              id: toolu_write_unread,
              name: Write,
              input: { path: 'src/config 配置.ts', content: "export const port = 1;\n" },
            }
      - tool_calls:
          - { id: toolu_read, name: Read, input: { path: 'src/config 配置.ts' } }
      - tool_calls:
          - {
              id: toolu_edit_read,
              name: Edit,
              input: { path: 'src/config 配置.ts', edits: [{ oldText: '8080', newText: '9090' }] },
            }
      - tool_calls:
          - {
              id: toolu_write_new,
              name: Write,
              input: { path: 'src/new.ts', content: "export {};\n" },
            }
      - text: 'Read first, then edited.'
actions:
  - prompt: { text: 'Change the port to 9090.', turn: t }
expect:
  events:
    - {
        method: item/completed,
        params: { item: { itemId: toolu_edit_unread, tool: Edit, status: failed } },
      }
    - {
        method: item/completed,
        params: { item: { itemId: toolu_write_unread, tool: Write, status: failed } },
      }
    - {
        method: item/completed,
        params: { item: { itemId: toolu_edit_read, tool: Edit, status: completed } },
      }
    - {
        method: item/completed,
        params: { item: { itemId: toolu_write_new, tool: Write, status: completed } },
      }
    - { method: turn/completed, turn: t, params: { status: completed } }
  files:
    'src/config 配置.ts': "export const port = 9090;\n"
    'src/new.ts': "export {};\n"
  requests:
    - index: 5
      tool_results:
        - {
            id: toolu_edit_unread,
            is_error: true,
            contains: 'has not been read in this session. Read it with the Read tool first',
          }
        - {
            id: toolu_write_unread,
            is_error: true,
            contains: 'has not been read in this session. Read it with the Read tool first',
          }
        - { id: toolu_read, is_error: false, contains: "     1\texport const port = 8080;" }
        - { id: toolu_edit_read, is_error: false, contains: 'Successfully replaced 1 block(s)' }
        - { id: toolu_write_new, is_error: false, contains: 'Successfully wrote' }
  request_counts: { main: 6 }
