id: todo-stale-reminder
description: With open tasks and eight rounds of tool calls without a list update, the next model request carries the stale-list reminder listing the open tasks; the request before does not, and the system prompt and tools stay byte-identical (T26).
capabilities: [CAP-TODO-REMIND-001]
workspace:
  files:
    a.txt: "alpha\n"
providers:
  main:
    wire: anthropic
    steps:
      - tool_calls:
          - id: todo
            name: TodoWrite
            input:
              todos:
                - { content: Read the file, status: completed }
                - { content: Summarize it, status: in_progress }
                - { content: Report back, status: pending }
      - tool_calls: [{ id: r1, name: Glob, input: { pattern: '*.txt' } }]
      - tool_calls: [{ id: r2, name: Glob, input: { pattern: '*.txt' } }]
      - tool_calls: [{ id: r3, name: Glob, input: { pattern: '*.txt' } }]
      - tool_calls: [{ id: r4, name: Glob, input: { pattern: '*.txt' } }]
      - tool_calls: [{ id: r5, name: Glob, input: { pattern: '*.txt' } }]
      - tool_calls: [{ id: r6, name: Glob, input: { pattern: '*.txt' } }]
      - tool_calls: [{ id: r7, name: Glob, input: { pattern: '*.txt' } }]
      - tool_calls: [{ id: r8, name: Glob, input: { pattern: '*.txt' } }]
      - text: Done.
actions:
  - prompt: { text: Work through the list., turn: t }
expect:
  request_counts: { main: 10 }
  requests:
    - { index: 8, not_contains: ['[PiArc reminder]'] }
    - index: 9
      same_system_as: 0
      same_tools_as: 0
      occurrences: { '[PiArc reminder]': 1 }
      user_message_contains:
        - '[PiArc reminder]'
        - 'The task list has not changed for 8 rounds of tool calls'
        - '- [in progress] Summarize it'
        - '- [pending] Report back'
