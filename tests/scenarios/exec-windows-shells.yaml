id: exec-windows-shells
description: On Windows with Git for Windows installed the model gets Bash (run by Git Bash) and PowerShell; both print Chinese text intact, and a cd into a workspace directory carries over after Git Bash's /c/ path is converted.
capabilities: [CAP-EXEC-GITBASH-001, CAP-TOOL-POWERSHELL-001]
platforms: [windows]
platform_reason: Git Bash and the PowerShell tool exist on Windows only.
providers:
  main:
    wire: anthropic
    steps:
      - tool_calls:
          - { id: toolu_bash, name: Bash, input: { command: 'echo 中文输出 Bash; uname -o; mkdir -p sub && cd sub' } }
      - tool_calls:
          - { id: toolu_pwd, name: Bash, input: { command: 'pwd' } }
      - tool_calls:
          - { id: toolu_ps, name: PowerShell, input: { command: "Write-Output '中文输出 PowerShell'" } }
      - text: 'Both shells ran.'
actions:
  - prompt: { text: 'Use both shells.', turn: t }
expect:
  events:
    - { method: item/completed, params: { item: { itemId: toolu_bash, status: completed } } }
    - { method: item/completed, params: { item: { itemId: toolu_pwd, status: completed } } }
    - method: item/completed
      params: { item: { itemId: toolu_ps, type: commandExecution, tool: PowerShell, status: completed } }
    - { method: turn/completed, turn: t, params: { status: completed } }
  requests:
    - index: 0
      tools_include: [Bash, PowerShell]
    - index: 3
      tool_results:
        - { id: toolu_bash, is_error: false, contains: "中文输出 Bash\nMsys\n" }
        - { id: toolu_pwd, is_error: false, contains: "工作区/sub\n" }
        - { id: toolu_ps, is_error: false, contains: '中文输出 PowerShell' }
  request_counts: { main: 4 }
