id: exec-shell-tools-macos
description: On macOS the model gets the Bash tool and no PowerShell tool.
capabilities: [CAP-TOOL-POWERSHELL-001]
platforms: [macos]
platform_reason: The Windows tool list is checked by exec-windows-shells.
providers:
  main:
    wire: anthropic
    steps:
      - text: 'Hello.'
actions:
  - prompt: { text: 'Hi.', turn: t }
expect:
  events:
    - { method: turn/completed, turn: t, params: { status: completed } }
  requests:
    - index: 0
      tools_include: [Bash]
      tools_exclude: [PowerShell]
  request_counts: { main: 1 }
