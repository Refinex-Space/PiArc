id: turn-steer
description: A steering message sent while a tool runs joins the running turn and reaches the model in the turn's next request, after the tool results.
capabilities: [CAP-TURN-STEER-001]
providers:
  main:
    wire: anthropic
    # Pi puts the steering message right after the tool results, a second user message in a
    # row (the Anthropic API joins them; the strict alternation rule does not).
    validation: { rules: { role_order: false } }
    steps:
      - text: 'Waiting for the signal.'
        tool_calls:
          - { id: toolu_wait, name: Bash, input: { command: 'while [ ! -f go ]; do sleep 0.05; done; echo go' } }
      - text: 'Steered answer.'
actions:
  - prompt: { text: 'Wait for the signal.', turn: t }
  - wait: { method: item/started, params: { item: { itemId: toolu_wait } } }
  - steer: { text: 'Also count the files.', item: s }
  - write_file: { path: go, content: '' }
expect:
  events:
    - { method: item/completed, params: { item: { itemId: toolu_wait, status: completed } } }
    - { method: item/completed, turn: t, params: { item: { type: userMessage, text: 'Also count the files.' } } }
    - { method: item/completed, turn: t, params: { item: { type: agentMessage, text: 'Steered answer.' } } }
    - { method: turn/completed, turn: t, params: { status: completed } }
  requests:
    - { index: 1, user_texts: ['Wait for the signal.', 'Also count the files.'], tool_results: [{ id: toolu_wait, is_error: false, contains: go }] }
  request_counts: { main: 2 }
