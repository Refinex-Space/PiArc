id: turn-retry-recoverable-errors
description: An overloaded (529) and a rate-limited (429) answer are retried; the client sees each retry with its attempt number, and the successful request carries none of the failed attempts.
capabilities: [CAP-TURN-RETRY-001]
providers:
  main:
    wire: anthropic
    steps:
      - error: { kind: overloaded, message: 'the mock is overloaded' }
      - error: { kind: rate_limit, retry_after_secs: 1, message: 'the mock is rate limited' }
      - text: 'Recovered.'
actions:
  - prompt: { text: 'Answer despite errors.', turn: t }
expect:
  events:
    - { method: turn/retrying, turn: t, params: { attempt: 1 } }
    - { method: turn/retrying, turn: t, params: { attempt: 2 } }
    - { method: item/completed, params: { item: { type: agentMessage, text: 'Recovered.' } } }
    - { method: turn/completed, turn: t, params: { status: completed } }
  requests:
    - { index: 2, roles: [user], user_texts: ['Answer despite errors.'], not_contains: [overloaded, rate limited] }
  request_counts: { main: 3 }
