id: notebook-edit-insert
description: NotebookEdit inserts a markdown cell after the cell it names; the new cell gets an id derived from the tool call (nbformat 4.5) and lands in the notebook's own formatting, nothing else changes (T42).
capabilities: [CAP-TOOL-NOTEBOOK-001]
workspace:
  fixtures:
    analysis.ipynb: notebook/base.ipynb
sessions:
  main: { provider: main, mode: acceptEdits }
providers:
  main:
    wire: anthropic
    steps:
      - tool_calls: [{ id: read1, name: Read, input: { path: analysis.ipynb } }]
      - tool_calls:
          - id: call-3
            name: NotebookEdit
            input:
              notebook_path: analysis.ipynb
              cell_id: load
              edit_mode: insert
              cell_type: markdown
              new_source: "## Plot\nBelow."
      - text: Inserted.
actions:
  - prompt: { text: Add a heading before the plot., turn: t }
expect:
  fixtures:
    analysis.ipynb: notebook/base-insert-after-load.ipynb
  requests:
    - index: 2
      tool_results:
        - { id: read1, is_error: false }
        - { id: call-3, is_error: false, contains: Inserted a markdown cell }
