id: perm-rule-match
description: Claude Code rules from the user and project files decide calls without asking, deny before allow; a whole-tool deny removes the tool from every model request and from the system prompt's tool guidance (T23, R3).
capabilities: [CAP-PERM-RULE-001, CAP-PERM-TOOLS-001]
workspace:
  trusted: true
  files:
    notes.txt: "plain notes\nsecond line\n"
    secrets/key.txt: "do not read\n"
    .piarc/settings.json: '{"permissions":{"deny":["Glob","Read(secrets/**)","Bash(git push *)"]}}'
  run_files:
    'data 数据/settings.json': '{"permissions":{"allow":["Bash(git *)","Bash(sed -n *)"],"ask":["Bash(sed -n 2p *)"]}}'
providers:
  main:
    wire: anthropic
    steps:
      - tool_calls:
          - { id: push, name: Bash, input: { command: 'git push origin main' } }
      - tool_calls:
          - { id: secret, name: Read, input: { path: secrets/key.txt } }
      - tool_calls:
          - { id: notes, name: Read, input: { path: notes.txt } }
      - tool_calls:
          - { id: env, name: Bash, input: { command: 'sed -n 1p notes.txt' } }
      - tool_calls:
          - { id: ask, name: Bash, input: { command: 'sed -n 2p notes.txt' } }
      - text: Finished.
actions:
  - prompt: { text: Check the rules., turn: t }
approvals:
  - { tool: Bash, decision: deny, feedback: Not that one. }
expect:
  request_counts: { main: 6 }
  requests:
    - { index: 0, tools_include: [Read, Bash, Grep], tools_exclude: [Glob] }
    # R3: the system prompt is frozen on the first run; it must not describe the removed tool.
    - { index: 0, not_contains: ['Glob: find files by name or path pattern'] }
    - { index: 5, tools_exclude: [Glob] }
    - index: 5
      tool_results:
        - { id: push, is_error: true, contains: 'Bash(git push *)' }
        - { id: secret, is_error: true, contains: 'Read(secrets/**)' }
        - { id: notes, is_error: false, contains: plain notes }
        - { id: env, is_error: false, contains: plain notes }
        - { id: ask, is_error: true, contains: Not that one. }
