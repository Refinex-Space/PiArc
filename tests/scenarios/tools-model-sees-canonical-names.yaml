id: tools-model-sees-canonical-names
description: The model is offered the canonical tool names (Read, Write, Edit, Bash, Glob, Grep, and PowerShell on Windows), none of Pi's native names, and a call by canonical name runs.
capabilities: [CAP-TOOL-PROFILE-001]
workspace:
  files:
    'readme.md': "# Fixture\n"
providers:
  main:
    wire: anthropic
    steps:
      - tool_calls:
          - { id: toolu_read, name: Read, input: { path: readme.md } }
      - text: 'Read it.'
actions:
  - prompt: { text: 'Read the readme.', turn: t }
expect:
  events:
    - {
        method: item/completed,
        params: { item: { itemId: toolu_read, tool: Read, status: completed } },
      }
    - { method: turn/completed, turn: t, params: { status: completed } }
  requests:
    - index: 0
      # Windows sessions also get PowerShell (T17): every canonical name, none of Pi's own.
      tools_include: [Read, Write, Edit, Bash, Glob, Grep]
      tools_exclude: [read, write, edit, bash, grep, find, ls, powershell]
    - { index: 1, tool_results: [{ id: toolu_read, is_error: false, contains: '# Fixture' }] }
