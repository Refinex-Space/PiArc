id: hooks-session-end
description: A SessionEnd hook runs once with reason other when the session closes (archived here), with the common input fields (T25).
capabilities: [CAP-HOOK-SESSION-001]
workspace:
  trusted: true
  fixtures:
    hook.mjs: hooks/hook.mjs.txt
  files:
    .claude/settings.json: |
      {"hooks": {"SessionEnd": [{"matcher": "other", "hooks": [{"type": "command", "command": "node hook.mjs end"}]}]}}
providers:
  main:
    wire: anthropic
    steps:
      - text: 'Done.'
actions:
  - prompt: { text: 'Say done.', turn: t }
  - wait: { method: turn/completed, turn: t }
  - set_prefs: { archived: true }
expect:
  request_counts: { main: 1 }
  json_lines:
    hook-log/end.jsonl:
      - types:
          {
            session_id: string,
            transcript_path: string,
            cwd: string,
            hook_event_name: string,
            reason: string,
          }
        input: { hook_event_name: SessionEnd, reason: other }
