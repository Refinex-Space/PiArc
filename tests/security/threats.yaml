# Threat map (T45, NFR-03): one entry per row of architecture section 10.1, its countermeasures
# and the tests that assert them. Checked by `node scripts/ci/check-threats.mjs` (verify step 16),
# which also generates docs/security/threat-coverage.md. Rules: docs/engineering/testing.md
# section 16.
#
# - id: THR-<NN>, stable; title: the threat as written in the first column of section 10.1.
# - countermeasures[].arch: one countermeasure of the row's third column, verbatim (the column is
#   split at `；`); every one must be mapped. Entries without `arch` add a countermeasure the row
#   does not name.
# - type: automated (at least one test), process (reason; a checklist item as `process:` ID),
#   accepted-risk (reason and refs), deferred (reason and the unfinished task that adds tests).
# - tests: `cap:<CAP-ID>` (L2 scenarios covering the capability), `rust:<file>::<fn>`,
#   `vitest:<file>::<title>`, `l4:<file>::<title>`, `ci:<script>[#<check>]`,
#   `process:<file>#<marker>` (the file contains `<!-- <marker> -->`).
# - Tests added for a threat carry its number: `it('THR-04 …')`, `fn thr04_…`, an L2 description
#   starting with `THR-04.`; the check fails when such a test is not mapped to that threat.
version: 1
threats:
  - id: THR-01
    title: 提示注入导致破坏性操作
    countermeasures:
      - arch: 默认询问
        measure: 手动模式下非只读的命令与改动先询问
        type: automated
        tests:
          - rust:crates/piarc-policy/src/decision/tests.rs::mode_defaults
          - cap:CAP-PERM-MODE-001
          - cap:CAP-PERM-READONLY-001
      - arch: deny 规则
        measure: deny 规则优先于 allow 与 hook 的允许
        type: automated
        tests:
          - rust:crates/piarc-policy/src/decision/tests.rs::deny_then_ask_then_allow_and_allow_never_beats_deny
          - rust:crates/piarc-core/src/tool_io/hooks_tests.rs::a_hook_allow_leaves_deny_rules_ask_rules_and_plan_mode_in_force
          - cap:CAP-PERM-RULE-001
      - arch: Bash 子命令分析
        measure: 复合命令逐个子命令裁决，分析不了的命令询问
        type: automated
        tests:
          - rust:crates/piarc-policy/tests/bash_cases.rs::data_driven_cases
          - rust:crates/piarc-policy/tests/bash_cases.rs::random_input_does_not_panic
          - cap:CAP-PERM-BASH-001
      - arch: 关键路径删除总是询问
        measure: 删除主目录、工作区根等关键路径在任何模式下询问，包括跳过权限与沙箱自动批准
        type: automated
        tests:
          - rust:crates/piarc-policy/src/decision/tests.rs::mandatory_asks_hold_in_every_mode
          - rust:crates/piarc-core/src/tool_io/policy/tests/t23.rs::critical_deletions_ask_even_in_bypass_with_an_allow_rule
          - cap:CAP-PERM-CRITICAL-001
          - cap:CAP-SANDBOX-AUTO-001
          - cap:CAP-SEC-INJECTION-001
      - arch: 沙箱
        measure: 命令沙箱限制写入范围与网络（macOS）
        type: automated
        tests:
          - rust:crates/piarc-core/tests/sandbox.rs::writes_stay_inside_the_writable_directories
          - rust:crates/piarc-core/tests/sandbox.rs::protected_paths_refuse_writes
          - cap:CAP-SANDBOX-MACOS-001
      - arch: 审批卡展示完整命令
        measure: 审批卡显示完整命令
        type: automated
        tests:
          - vitest:apps/desktop/src/renderer/transcript/rows/rows.test.tsx::renders the five ledger card kinds, keeps approvals through a history reload, and removes invalidated requests
          - l4:apps/desktop/e2e/t19-security.e2e.ts::renders reply, tool output, command output and file paths as inert text
          - cap:CAP-SEC-INJECTION-001
          - vitest:apps/desktop/src/renderer/transcript/reveal.test.ts::THR-01 shows every bidirectional control as a visible marker, in place
      - arch: WebFetch 的网页只作为辅助模型提问里的材料，提取结果是工具结果，不进 system prompt，网页内容不影响权限裁决（T29）
        measure: 网页只作为辅助模型的材料，提取结果是工具结果
        type: automated
        tests:
          - vitest:agent-host/src/harness/web-fetch.test.ts::fetches through Core and answers with the auxiliary model
          - rust:crates/piarc-core/src/tool_io/policy/tests/t29.rs::a_fetch_needs_the_approved_url
          - cap:CAP-TOOL-WEBFETCH-001
          - cap:CAP-SEC-INJECTION-001

  - id: THR-02
    title: 恶意项目配置
    countermeasures:
      - measure: 内置浏览器里来自网页的文字（Browser 工具的输出、加入对话的元素上下文、浏览器状态提醒）放在随机 nonce 的边界里并写明是网页数据，网页文字关不掉边界；用户的评论写在边界外
        type: automated
        tests:
          - vitest:agent-host/src/harness/browser.test.ts::wraps the output in a boundary page text cannot close
          - vitest:agent-host/src/harness/browser.test.ts::lists the spaces inside a nonce boundary the titles cannot close
          - vitest:apps/desktop/src/renderer/composer/browser-context.test.ts::opens with the data notice inside a nonce boundary and numbers the items
          - vitest:apps/desktop/src/renderer/composer/browser-context.test.ts::escapes page text so it cannot close the boundary
          - vitest:apps/desktop/src/renderer/composer/browser-context.test.ts::puts the user’s comments above the boundary, by number
      - arch: 项目信任闸门（10.2）：信任前不执行任何项目级可执行配置
        measure: 信任前不运行项目 hooks、不连项目 MCP、不应用项目 allow 规则、不加载项目插件与 Pi 扩展
        type: automated
        tests:
          - rust:crates/piarc-config/tests/settings.rs::project_executables_wait_for_trust_and_deny_rules_do_not
          - rust:crates/piarc-core/src/tool_io/hooks_tests.rs::untrusted_project_hooks_wait_for_trust_while_user_hooks_run
          - rust:crates/piarc-core/src/mcp/tests.rs::an_untrusted_projects_servers_wait_and_user_servers_are_ready
          - rust:crates/piarc-core/src/plugins/tests.rs::an_untrusted_project_loads_no_project_package_and_trust_confirms_its_items
          - rust:crates/piarc-testkit/tests/agent_host/trust.rs::project_extensions_load_only_while_core_trusts_the_project
          - vitest:agent-host/src/harness/project-trust.test.ts::is untrusted when Core does not answer in time
          - cap:CAP-TRUST-PROJECT-001
          - cap:CAP-MCP-TRUST-001
          - cap:CAP-PLUGIN-TRUST-001
          - cap:CAP-CONFIG-COMPAT-001
          - cap:CAP-SEC-MALICIOUS-REPO-001
      - measure: 项目配置新增的可执行项在再次确认前不生效
        type: automated
        tests:
          - rust:crates/piarc-core/tests/state.rs::a_trust_view_lists_the_items_and_what_is_new_since_the_decision
          - rust:crates/piarc-config/tests/executables.rs::lists_every_category_with_its_source_and_detects_new_items
          - l4:apps/desktop/e2e/t18-trust.e2e.ts::the trust dialog lists the items; the decision decides what the model gets
          - cap:CAP-SEC-MALICIOUS-REPO-001
      - measure: 项目文件选不了跳过权限与 auto，项目的沙箱设置只能收紧
        type: automated
        tests:
          - rust:crates/piarc-config/tests/claude.rs::project_files_cannot_select_bypass_or_auto_and_the_diagnostics_say_why
          - rust:crates/piarc-core/src/tool_io/policy/tests/t23.rs::bypass_needs_the_user_setting_and_project_modes_are_ignored
          - rust:crates/piarc-config/src/sandbox.rs::a_project_cannot_turn_the_sandbox_off
          - cap:CAP-SANDBOX-PROJECT-001
      - measure: 信任查询任何失败都按不信任
        type: automated
        tests:
          - rust:crates/piarc-core/tests/state.rs::trust_get_answers_untrusted_on_every_failure
          - vitest:agent-host/src/harness/project-trust.test.ts::is untrusted when the connection to Core is gone

  - id: THR-03
    title: 恶意插件 / MCP server / Pi 包
    countermeasures:
      - arch: 安装前展示来源与能力
        measure: 启用前的原生确认列出来源与每个可执行项
        type: automated
        tests:
          - vitest:apps/desktop/src/main/core/plugins-ipc.test.ts::lists the source and every executable item, with the extension note
          - l4:apps/desktop/e2e/t40-plugins.e2e.ts::packages install off, turn on only after the native confirmation, and list what is unsupported
          - cap:CAP-PLUGIN-001
      - arch: 启用需确认
        measure: 启用与更新带来的新增项需确认；npm 只经内置 npm，不运行安装脚本，不读包自带的 .npmrc
        type: automated
        tests:
          - rust:crates/piarc-core/src/plugins/tests.rs::npm_installs_run_the_bundled_npm_without_scripts
          - rust:crates/piarc-core/src/plugins/tests.rs::thr03_a_cloned_packages_npmrc_cannot_choose_what_npm_runs
          - rust:crates/piarc-core/src/plugins/tests.rs::a_git_update_leaves_new_items_off_until_confirmed
          - vitest:apps/desktop/src/main/core/plugins-ipc.test.ts::answers planned confirmations and records them
          - cap:CAP-PLUGIN-HOOKS-001
      - arch: Agent Host 的 Seatbelt 配置限制进程级写入范围
        measure: Agent Host 及其子进程（MCP server、扩展、npm）只能写工作区与自己的目录（macOS）
        type: automated
        tests:
          - rust:crates/piarc-core/tests/agent_host_profile.rs::the_agent_host_writes_only_its_places
          - rust:crates/piarc-core/tests/agent_host_profile.rs::thr03_the_agent_host_cannot_plant_code_in_pis_directory
          - rust:crates/piarc-testkit/tests/sessions/sandbox.rs::the_agent_host_profile_keeps_extensions_and_mcp_servers_in_their_places
      - measure: Windows 上 Agent Host 没有进程级隔离
        type: accepted-risk
        reason: Windows 到 Beta 没有等价的 OS 沙箱，Agent Host 只用 Job Object 管理进程树，没有第二道防线；设置页、环境栏与配置诊断标明沙箱不生效
        refs: [ADR-0057, I180]
        tests:
          - cap:CAP-SANDBOX-WINDOWS-001
      - arch: Pi 自己设置里的包清单不由 Agent Host 安装或加载（T45）
        measure: Pi 自己设置里的包清单不由 Agent Host 安装或加载
        type: automated
        tests:
          - vitest:agent-host/src/runtime/pi-settings.test.ts::THR-03 hides every package source from Pi, so nothing installs, runs or loads
          - cap:CAP-SEC-PI-PACKAGES-001
      - arch: 市场安装只连目录的 registry，装完核对名称、版本、完整性值与锁文件来源，不符即删除（ADR-0102）
        measure: 页面只能给包名、精确版本与作用域；npm 只连固定 registry、不读用户 .npmrc、不运行安装脚本；装完的包与目录不符、依赖来自别处或只含主题时删除并拒绝；安装默认关闭，开启仍经原生确认；代理连不上不改直连
        type: automated
        tests:
          - rust:crates/piarc-core/src/plugins/market.rs::the_staged_install_must_be_what_the_catalog_described
          - rust:crates/piarc-testkit/tests/market.rs::installs_are_checked_stay_off_and_refusals_leave_nothing
          - rust:crates/piarc-testkit/tests/market.rs::the_users_proxy_carries_everything_and_its_refusal_is_not_a_direct_connection
          - vitest:apps/desktop/src/main/core/market-ipc.test.ts::builds install requests from a name, a version and a scope, never a location
          - l4:apps/desktop/e2e/market-install.e2e.ts::installs off, turns on through the native confirmation and uninstalls in two steps

  - id: THR-04
    title: 凭据泄露
    countermeasures:
      - arch: 加密保险箱，主密钥只在系统凭据库
        measure: 凭据只在 AES-256-GCM 保险箱，主密钥在系统凭据库，磁盘上没有明文
        type: automated
        tests:
          - rust:crates/piarc-secrets/tests/vault.rs::round_trips_entries_through_the_encrypted_file
          - rust:crates/piarc-secrets/tests/vault.rs::any_modified_byte_fails_with_an_integrity_error
          - rust:crates/piarc-testkit/tests/sessions/provider_settings.rs::provider_settings_crud_keeps_credentials_in_the_vault
          - rust:crates/piarc-testkit/tests/sessions/login.rs::authorization_code_sign_in_reaches_the_vault_and_signs_out
          - rust:crates/piarc-core/src/tool_io/policy/tests/t38.rs::agent_hosts_cannot_reach_search_keys
          - cap:CAP-PROVIDER-OAUTH-001
      - arch: 不经环境变量传递
        measure: Agent Host、命令与 MCP 子进程的环境没有凭据，只透传白名单变量
        type: automated
        tests:
          - rust:crates/piarc-host/src/config.rs::passes_only_named_variables_and_the_fixed_ones
          - rust:crates/piarc-core/tests/exec_commands.rs::the_environment_has_no_internal_variables
          - rust:crates/piarc-testkit/tests/agent_host/credentials.rs::login_and_one_refresh_reach_the_vault_and_every_session
          - vitest:agent-host/src/runtime/credentials.test.ts::reports an unavailable vault and never falls back to the environment
          - rust:crates/piarc-testkit/tests/credential_leaks.rs::thr04_a_vault_credential_stays_out_of_child_environments_and_log_files
          - cap:CAP-EXEC-ENV-001
      - arch: 日志与诊断包自动脱敏
        measure: 日志写入前替换保险箱里的凭据值、常见密钥格式、Bearer token 与 JWT（Core 与 Agent Host 的 stderr 同一处理）；服务商回显的密钥在进入会话文件前替换
        type: automated
        tests:
          - rust:crates/piarc-telemetry/src/redact_tests.rs::thr04_remembered_credentials_are_replaced_wherever_they_appear
          - rust:crates/piarc-telemetry/src/redact_tests.rs::thr04_provider_key_formats_are_replaced
          - rust:crates/piarc-telemetry/src/redact_tests.rs::thr04_cloud_access_keys_are_replaced
          - rust:crates/piarc-telemetry/src/redact_tests.rs::thr04_bearer_tokens_and_jwts_are_replaced_keeping_the_scheme
          - rust:crates/piarc-telemetry/src/redact_tests.rs::thr04_environment_style_secret_names_are_replaced
          - rust:crates/piarc-telemetry/tests/redaction.rs::thr04_credentials_in_core_and_agent_host_lines_reach_the_files_redacted
          - rust:crates/piarc-testkit/tests/credential_leaks.rs::thr04_a_vault_credential_stays_out_of_child_environments_and_log_files
          - vitest:agent-host/src/providers/policy.test.ts::redacts the provider key echoed by an HTTP error before the Pi session can persist it
      - measure: 数据只在本机：一次完整 mock 会话里，Agent Host 只连模型服务商，Electron（主进程、渲染进程、Chromium 后台）没有外连；PiArc 没有遥测（外连清单见 docs/security/egress.md）
        type: automated
        tests:
          - rust:crates/piarc-testkit/tests/egress.rs::thr04_a_whole_mock_session_connects_only_to_the_model_provider
          - l4:apps/desktop/e2e/t45-egress.e2e.ts::THR-04 a whole mock session makes no outbound connection from Electron
          - rust:crates/piarc-host/src/config.rs::passes_only_named_variables_and_the_fixed_ones
      - measure: 诊断包由用户手动导出：先展示文件清单与脱敏摘要，经主进程保存对话框确认后才写出；不含保险箱、数据库与会话内容，主目录写作 ~
        type: automated
        tests:
          - rust:crates/piarc-telemetry/src/bundle_tests.rs::thr04_the_bundle_carries_no_credential_and_no_home_path
          - rust:crates/piarc-core/tests/diagnostics.rs::thr04_the_exported_bundle_holds_no_credential_session_content_or_home_path
          - vitest:apps/desktop/src/main/core/diagnostics-ipc.test.ts::prepares with the client versions and writes nothing until the user picks a place
          - l4:apps/desktop/e2e/t45-diagnostics.e2e.ts::the diagnostic bundle shows what it holds and is written only where the user chooses

  - id: THR-05
    title: 沙箱逃逸
    countermeasures:
      - arch: 沙箱默认无直连网络
        measure: 沙箱内只能经会话代理联网，白名单外的主机询问
        type: automated
        tests:
          - rust:crates/piarc-core/tests/sandbox.rs::connections_around_the_proxy_fail
          - rust:crates/piarc-sandbox/tests/proxy.rs::connect_outside_the_allowlist_is_refused_with_a_reason
          - rust:crates/piarc-sandbox/tests/proxy.rs::names_resolving_to_loopback_or_metadata_are_refused
          - rust:crates/piarc-testkit/tests/sessions/sandbox.rs::hosts_outside_the_allowlist_ask_and_a_changed_allowlist_applies_to_the_next_command
      - arch: 沙箱外重试必须审批
        measure: 沙箱外重试在任何模式下询问，只能允许一次
        type: automated
        tests:
          - rust:crates/piarc-policy/src/decision/tests.rs::an_unsandboxed_command_asks_in_every_mode
          - cap:CAP-SANDBOX-RETRY-001
      - measure: agent 启动进程的每条路径都经同一沙箱包装
        type: automated
        tests:
          - cap:CAP-SANDBOX-PATHS-001
      - measure: 内置浏览器的脚本宿主（智能体的 Browser 脚本）是不能联网的沙箱页面，宿主分区的请求全部取消（ADR-0091）
        type: automated
        tests:
          - 'l4:apps/desktop/e2e/browser-agent.e2e.ts::THR-05: the script host reaches nothing on the network'
          - vitest:apps/desktop/src/main/browser/host-session.test.ts::allows scripts only from the host and no connections
      - measure: Windows 上没有命令沙箱
        type: accepted-risk
        reason: Windows 到 Beta 没有 OS 级沙箱（需求 D7），经批准的命令可以写工作区外与外传数据；沙箱开关在 Windows 上不可用且说明原因
        refs: [ADR-0057, I180]
        tests:
          - cap:CAP-SANDBOX-WINDOWS-001

  - id: THR-06
    title: 审批疲劳与误点
    countermeasures:
      - arch: 400 ms 防误触
        measure: 新卡片 400 ms 内的按键不作答
        type: automated
        tests:
          - vitest:apps/desktop/src/renderer/transcript/rows/approval-keys.test.ts::arms the first visible card at 400 ms and ignores repeats
          - l4:apps/desktop/e2e/t43-approval-focus.e2e.ts::a new card takes focus on its container, waits for a composition, and guards Enter for 400 ms
      - arch: 长参数阅读闸门
        measure: 折叠的长参数展开之前不能"总是允许"
        type: automated
        tests:
          - vitest:apps/desktop/src/renderer/transcript/rows/approval-keys.test.ts::gates persistent rules on protected paths and collapsed parameters
          - l4:apps/desktop/e2e/t20-approvals.e2e.ts::guards approval shortcuts with the actual composer, focused card and visible order
      - arch: '"总是允许"规则可预览、可编辑、可撤销'
        measure: '"总是允许"逐条可编辑，经原生确认保存，设置页可删除'
        type: automated
        tests:
          - l4:apps/desktop/e2e/t23-permissions.e2e.ts::always allow saves one edited rule per subcommand; bypass needs settings and a native confirmation
          - l4:apps/desktop/e2e/t23-permissions.e2e.ts::the Permissions page edits rules by source behind a native confirmation and filters the audit
          - rust:crates/piarc-core/src/tool_io/policy/tests.rs::permanent_answers_must_include_every_value_shown_for_confirmation
          - cap:CAP-PERM-APPROVAL-001
      - arch: 审计可查
        measure: 审批结果与规则命中写入审计，设置页可筛选
        type: automated
        tests:
          - rust:crates/piarc-core/src/tool_io/policy/tests.rs::concurrent_answers_apply_once_and_each_decision_is_audited_by_session
          - rust:crates/piarc-core/src/tool_io/policy/tests/t23.rs::settings_page_lists_edits_and_audits_rules
          - cap:CAP-PERM-AUDIT-001
      - measure: 系统通知对高风险请求只给"打开"
        type: automated
        tests:
          - rust:crates/piarc-core/src/tool_io/policy/tests/t42.rs::long_critical_and_protected_requests_only_open_the_card
          - vitest:apps/desktop/src/main/platform/attention.test.ts::only opens a request a notification may not allow

  - id: THR-07
    title: 多窗口审批错乱
    countermeasures:
      - arch: 审批账本的 revision 与 connectionEpoch 校验
        measure: 同一请求只采用第一个有效答复，过期的 revision 与连接代次被拒
        type: automated
        tests:
          - rust:crates/piarc-core/src/tool_io/policy/tests.rs::concurrent_answers_apply_once_and_each_decision_is_audited_by_session
          - rust:crates/piarc-core/src/tool_io/policy/tests.rs::disconnect_expires_pending_cards_and_records_refusal_for_recovery
          - rust:crates/piarc-testkit/tests/sessions/permissions.rs::only_one_answer_applies_and_the_mode_entry_survives_core_restart
          - l4:apps/desktop/e2e/t35-windows.e2e.ts::one approval in two windows takes the first answer and leaves both
          - l4:apps/desktop/e2e/t42-notify.e2e.ts::approval notifications answer through the ledger

  - id: THR-08
    title: 供应链
    countermeasures:
      - arch: 精确版本锁定
        measure: npm 依赖精确版本；Cargo 依赖只在工作区声明且精确版本
        type: automated
        tests:
          - vitest:scripts/ci/supply-chain.test.mjs::THR-08 every npm dependency is pinned to an exact version
          - vitest:scripts/ci/supply-chain.test.mjs::THR-08 Cargo dependencies are declared once in the workspace with exact versions
      - arch: '`npm ci --ignore-scripts`'
        measure: CI 安装依赖不运行安装脚本
        type: automated
        tests:
          - vitest:scripts/ci/supply-chain.test.mjs::THR-08 every CI install of the dependencies runs without install scripts
      - arch: '`cargo-deny`、`cargo-audit`、`npm audit`'
        measure: 安全公告、许可证与来源检查；高危与严重问题没有现行例外即失败
        type: automated
        tests:
          - vitest:scripts/lib/audit.test.mjs::THR-08 fails on high and critical npm advisories and every cargo vulnerability without a current exception
          - vitest:scripts/lib/audit.test.mjs::THR-08 an exception past its review date no longer covers the advisory and fails
          - vitest:scripts/lib/audit.test.mjs::THR-08 checks the licenses of the npm packages that ship, not the development tools
          - ci:scripts/ci/audit-deps.mjs
          - ci:scripts/dev/verify.mjs#cargo-deny
      - arch: 新增依赖需评审
        measure: 新增依赖在 PR 中评审
        type: process
        reason: 是否引入一个依赖要人判断（用途、替代方案、维护状况、许可证、体积）；PR 模板的检查项要求写明，测试保证模板里有这一项
        tests:
          - process:.github/pull_request_template.md#dependency-review
          - vitest:scripts/ci/supply-chain.test.mjs::THR-08 the pull request template asks for a review of new dependencies and their sources

  - id: THR-09
    title: 更新通道被劫持
    countermeasures:
      - arch: 没有平台签名可依赖（ADR-0018）：HTTPS
        measure: 更新只经 HTTPS 从发布主机下载，其他协议与主机在连接前拒绝
        type: automated
        tests:
          - rust:crates/piarc-testkit/tests/updates.rs::thr09_only_https_and_the_release_hosts_are_reached
          - rust:crates/piarc-web/tests/download.rs::redirects_follow_allowed_hosts_only
      - arch: 每个版本的发布清单（文件名 + SHA-256）用项目自有 Ed25519 密钥签名，应用内置公钥，验证失败拒绝更新
        measure: 发布清单签名与文件哈希校验，篡改即拒绝
        type: automated
        tests:
          - rust:crates/piarc-core/tests/release.rs::a_signed_manifest_and_its_files_verify
          - rust:crates/piarc-core/tests/release.rs::changed_manifest_content_is_refused
          - rust:crates/piarc-core/tests/release.rs::a_file_whose_hash_differs_from_the_manifest_is_refused
          - rust:crates/piarc-core/tests/release.rs::a_manifest_signed_with_another_key_is_refused
          - vitest:scripts/release/release-manifest.test.mjs::rejects changed content, a changed trusted comment and another key
      - arch: 私钥只在需要维护者审批的发布环境中使用
        measure: 清单签名私钥只在受保护的发布环境
        type: process
        reason: 私钥只存在 GitHub 的 `release` 环境密钥里，该环境要维护者审批、只允许 `v*` 标签；工作流只在这个作业里读它（`.github/workflows/release.yml`），配置是否到位由发布规范的一次性配置核对
        tests:
          - process:docs/engineering/release.md#release-environment
      - arch: 应用内更新（ADR-0111）只认验签通过的清单，更新说明与每个产物核对大小与 SHA-256 后才交给安装步骤，macOS 安装前核对解出应用包的标识与版本，Windows 的 Velopack 源文件本身在清单里
        measure: 篡改的产物、别的密钥签的清单、不属于该版本的更新说明一律拒绝；解出的应用包标识或版本不符不安装；Velopack 找到的版本与 Core 校验的不同就不安装
        type: automated
        tests:
          - rust:crates/piarc-testkit/tests/updates.rs::thr09_tampered_artefacts_other_keys_and_foreign_notes_are_refused
          - rust:crates/piarc-core/src/updates/feed.rs::the_velopack_feed_names_the_full_package
          - vitest:apps/desktop/src/main/platform/mac-update.test.ts::THR-09 refuses another app or another version and removes the staging folder
          - vitest:apps/desktop/src/main/platform/windows-update.test.ts::THR-09 refuses a version other than the one Core verified
      - arch: 不防发布账号本身被攻破
        measure: 发布账号被攻破
        type: accepted-risk
        reason: 清单签名只防下载渠道与镜像被篡改；能以发布账号身份签名与发布的攻击者不在防护范围内
        refs: [ADR-0018]

  - id: THR-10
    title: 应用文件被篡改
    countermeasures:
      - arch: app.asar 开启完整性校验与 `OnlyLoadAppFromAsar`，但没有平台签名时完整性信息本身不受保护，只能防意外损坏
        measure: ASAR 完整性校验与 OnlyLoadAppFromAsar（发布构建的 fuse）
        type: automated
        tests:
          - vitest:scripts/ci/check-fuses.test.mjs::release settings follow ADR-0018 rule 1
          - vitest:scripts/ci/check-fuses.test.mjs::names a fuse whose state differs
          - ci:scripts/ci/check-fuses.mjs
      - arch: 对安装目录有写权限的本机攻击者可以篡改应用而不被发现，作为已接受的风险（ADR-0018）
        measure: 本机攻击者篡改安装目录
        type: accepted-risk
        reason: 没有平台签名时完整性信息本身不受保护；能写安装目录的本机攻击者已能以用户身份运行任意程序
        refs: [ADR-0018]
      - arch: 安装位置使用系统默认目录，依靠文件系统权限
        measure: 安装在系统默认目录
        type: process
        reason: 安装位置由安装器决定（macOS 拖入"应用程序"，Windows 由 Velopack 装在用户目录），首次运行指引说明
        refs: [ADR-0018]

  - id: THR-11
    title: 渲染进程注入（XSS）
    countermeasures:
      - arch: 渲染进程 sandbox + contextIsolation、无 Node
        measure: 所有窗口 sandbox、contextIsolation，页面没有 Node 全局
        type: automated
        tests:
          - vitest:apps/desktop/src/main/web-preferences.test.ts::fixes the security-relevant preferences
          - l4:apps/desktop/e2e/preload.e2e.ts::require, process, module and Buffer are not defined in the page
          - l4:apps/desktop/e2e/preload.e2e.ts::the window renderer runs in the OS-level sandbox
          - l4:apps/desktop/e2e/browser-basic.e2e.ts::THR-11 guests reach neither the preload nor Node
      - arch: 严格 CSP
        measure: 主进程下发的 CSP 不允许内联脚本、eval 与外部资源
        type: automated
        tests:
          - vitest:apps/desktop/src/main/security/csp.test.ts::allows no inline code or eval
          - l4:apps/desktop/e2e/csp.e2e.ts::does not run an injected inline script
          - l4:apps/desktop/e2e/csp.e2e.ts::refuses eval and the Function constructor
          - l4:apps/desktop/e2e/csp.e2e.ts::blocks fetch to an external address
      - arch: Markdown 不走 `innerHTML`，原始 HTML 当文本
        measure: 模型输出的原始 HTML 作为文本，链接只保留安全协议
        type: automated
        tests:
          - vitest:apps/desktop/src/renderer/transcript/markdown/to-ir.test.ts::turns every XSS payload into text or a link without a dangerous target
          - vitest:apps/desktop/src/renderer/transcript/markdown/to-ir.test.ts::drops every other target, including encoded ones
          - vitest:apps/desktop/src/renderer/transcript/markdown/to-ir.test.ts::keeps raw HTML as html nodes, verbatim
      - measure: Pi 包市场的包名、描述与 README 来自第三方：名称与描述只作文本、双向控制字符显示为码位，README 只经 MarkdownView（原始 HTML 当文本），链接经 openExternal 的原生确认（ADR-0102）
        type: automated
        tests:
          - vitest:apps/desktop/src/renderer/settings/market/MarketDetail.test.tsx::shows a package, its warnings and its README as Markdown with raw HTML as text
          - l4:apps/desktop/e2e/market-browse.e2e.ts::browses categories, searches, opens details and comes back to the same list
      - arch: preload 白名单 + 主进程校验来源
        measure: window.piarc 只有白名单函数，主进程按 senderFrame 的 origin 拒绝外来请求
        type: automated
        tests:
          - l4:apps/desktop/e2e/preload.e2e.ts::window.piarc exposes exactly the allowlisted functions
          - l4:apps/desktop/e2e/preload.e2e.ts::IPC from another origin is rejected
          - l4:apps/desktop/e2e/preload.e2e.ts::IPC from an origin that only starts with the app origin is rejected
          - vitest:apps/desktop/src/main/ipc/sender.test.ts::rejects origins that only start with the app origin
          - vitest:apps/desktop/src/main/browser/browser-ipc.test.ts::THR-11 rejects %j
          - l4:apps/desktop/e2e/browser-picker.e2e.ts::THR-11 a picked element with markup in its id and text shows it as text
          - l4:apps/desktop/e2e/t45-ipc-hardening.e2e.ts::THR-11 every window.piarc command answers malformed arguments with a structured error and the main process lives
      - arch: 有副作用的命令仍经 Core 的权限裁决
        measure: 终端写入要求真实输入；"总是允许"与 allow 规则经主进程原生确认
        type: automated
        tests:
          - vitest:apps/desktop/src/main/core/terminal-ipc.test.ts::refuses writes without recent real input; pointer moves need none
          - l4:apps/desktop/e2e/t20-approvals.e2e.ts::edits and confirms an exact rule, declines protected writes and restores the chosen mode
          - l4:apps/desktop/e2e/t45-ipc-hardening.e2e.ts::THR-11 allow rules, always-allow answers and sandbox loosening from the page wait for the native confirmation
      - measure: 发布构建的渲染进程不带测试页（事件探针、transcript 与终端原型）
        type: automated
        tests:
          - vitest:scripts/ci/check-app-layout.test.mjs::finds the renderer's test-page chunk on both separators and nothing else
          - ci:scripts/ci/check-app-layout.mjs
      - arch: XSS 载荷回归测试（第 10.3 节）
        measure: XSS 载荷集在渲染面上以文本呈现
        type: automated
        tests:
          - l4:apps/desktop/e2e/transcript-security.e2e.ts::renders every payload of a finished message as inert text
          - l4:apps/desktop/e2e/transcript-security.e2e.ts::renders the payloads inertly while they stream
          - l4:apps/desktop/e2e/t19-security.e2e.ts::renders reply, tool output, command output and file paths as inert text
          - l4:apps/desktop/e2e/t45-xss.e2e.ts::THR-11 approval cards, the Changes diff and its comments show the payloads as text
          - l4:apps/desktop/e2e/t45-xss.e2e.ts::THR-11 settings pages and a hook notice show names, values and messages as text

  - id: THR-12
    title: 应用被当作通用运行时滥用
    countermeasures:
      - arch: 发布构建关闭对应 fuses（ADR-0018）
        measure: 发布构建关闭 RunAsNode、NodeOptions、NodeCliInspect，打包产物上实际不生效
        type: automated
        tests:
          - vitest:scripts/ci/check-fuses.test.mjs::release settings follow ADR-0018 rule 1
          - vitest:scripts/ci/check-fuses.test.mjs::development settings differ only in EnableNodeCliInspectArguments
          - ci:scripts/ci/check-fuses.mjs
          - ci:scripts/ci/check-release-runtime.mjs#run-as-node
          - ci:scripts/ci/check-release-runtime.mjs#node-options
          - ci:scripts/ci/check-release-runtime.mjs#inspect
      - arch: 发布构建拒绝 Chromium 的远程调试开关（T45）
        measure: 发布构建拒绝 Chromium 的远程调试开关（没有对应的 fuse）
        type: automated
        tests:
          - vitest:apps/desktop/src/main/security/runtime-switches.test.ts::THR-12 removes and reports the remote debugging switches and nothing else
          - ci:scripts/ci/check-release-runtime.mjs#remote-debugging-port
      - arch: Agent Host 用独立的 node，不依赖这些开关
        measure: Agent Host 用内置 node 启动，命令环境去掉 Electron 与 Node 的内部变量
        type: automated
        tests:
          - rust:crates/piarc-core/src/agent_host.rs::host_config_puts_the_bundled_node_first_on_path
          - rust:crates/piarc-core/tests/exec_commands.rs::the_environment_has_no_internal_variables

  - id: THR-13
    title: 恶意链接与导航
    countermeasures:
      - arch: 应用窗口禁止导航到应用自身协议以外的地址
        measure: 导航与重定向只允许应用自身的 origin
        type: automated
        tests:
          - vitest:apps/desktop/src/main/security/navigation.test.ts::blocks other origins, including look-alike prefixes
          - vitest:apps/desktop/src/main/security/navigation.test.ts::THR-13 cancels main-frame, subframe and redirect navigations away from the app origin
          - l4:apps/desktop/e2e/navigation.e2e.ts::blocks changing location to an external address
          - l4:apps/desktop/e2e/navigation.e2e.ts::blocks a redirect from an app page to an external address
      - arch: 仅允许绑定工作台的一次性工具窗口，其余新窗口拒绝
        measure: 主进程只受理绑定于发起页面的临时工具窗口凭据；普通 window.open 与 target=_blank 被拒
        type: automated
        tests:
          - l4:apps/desktop/e2e/external-links.e2e.ts::denies window.open and target=_blank links
          - vitest:apps/desktop/src/main/tool-windows.test.ts::THR-13 restricts each native tool ticket to one page, document and use
      - arch: 外部链接确认后交给系统浏览器，且只放行 `https:`、`http:`、`mailto:`
        measure: 外链经主进程原生确认，只放行 https、http、mailto 且不带用户信息
        type: automated
        tests:
          - vitest:apps/desktop/src/main/external-links.test.ts::rejects every other scheme
          - vitest:apps/desktop/src/main/external-links.test.ts::rejects URLs with user information, which hide the real host
          - 'l4:apps/desktop/e2e/external-links.e2e.ts::rejects javascript:, file: and other schemes without asking'
          - l4:apps/desktop/e2e/t34-terminal.e2e.ts::OSC 8 links and plain URLs show their address and open only when confirmed
          - l4:apps/desktop/e2e/t34-terminal-windows.e2e.ts::the find bar counts matches; links open only when confirmed
          - l4:apps/desktop/e2e/t45-xss.e2e.ts::THR-13 OSC 8 links with script and data targets in the terminal neither open nor navigate
          - l4:apps/desktop/e2e/transcript-security.e2e.ts::opens links only through the main process confirmation
      - measure: piarc:// 链接只做定位，不带可执行内容，不打开网络共享与设备路径
        type: automated
        tests:
          - vitest:apps/desktop/src/main/launch.test.ts::carry nothing that runs
          - vitest:apps/desktop/src/main/launch.test.ts::THR-13 open no network share or device path, which would make Core reach another host

  - id: THR-14
    title: 同一用户的进程向 PiArc 注入代码
    countermeasures:
      - arch: macOS 的 PiArc 自身在 ad-hoc 签名下开启 hardened runtime（只给 `allow-jit` 与 `disable-library-validation`，主程序另给语音输入用的 `device.audio-input`，ADR-0096），实测 `DYLD_INSERT_LIBRARIES` 不再生效（S6 报告第 3 节）
        measure: 应用开启 hardened runtime；helper 的 entitlements 只有两项，主程序多一项麦克风，都不含 get-task-allow 与 DYLD 环境变量
        type: automated
        tests:
          - ci:scripts/ci/check-app-layout.mjs
          - vitest:scripts/ci/check-app-layout.test.mjs::reads an ad-hoc signature with the hardened runtime
          - vitest:scripts/ci/check-app-layout.test.mjs::THR-14 the helpers ask for only JIT and disabled library validation
      - arch: Core 以最小环境启动内置 node（不传 `DYLD_*`）
        measure: Agent Host 只收到白名单环境变量
        type: automated
        tests:
          - rust:crates/piarc-host/src/config.rs::passes_only_named_variables_and_the_fixed_ones
      - arch: 内置 node 保留 Node.js 官方签名，它自带 `get-task-allow` 与 `allow-dyld-environment-variables`，同一用户的进程仍可调试附加 Agent Host、读到其内存中的凭据，作为已接受的风险登记（I39）
        measure: 同一用户的进程调试附加 Agent Host
        type: accepted-risk
        reason: 去掉 get-task-allow 要对 node 重签，违背 ADR-0018 保留官方签名的决定；能调试附加的进程已以用户身份运行
        refs: [ADR-0018, I39]

  - id: THR-15
    title: 恶意仓库的 Git 配置
    countermeasures:
      - arch: Git 面板的只读查询用命令行覆盖关闭 fsmonitor、hooks、外部 diff、textconv 与 pager，清空仓库配置的全部 filter，只带最小环境、不继承 `GIT_*` 变量（ADR-0085）
        measure: 只读查询不运行仓库配置的任何程序；只读环境去掉继承的 GIT_* 变量与凭据
        type: automated
        tests:
          - rust:crates/piarc-git/tests/panel.rs::thr15_readonly_git_runs_no_repo_program
          - rust:crates/piarc-git/src/env.rs::read_only_takes_config_location_and_drops_git_variables
      - arch: 暂存、提交、检出、推送等写操作照常运行仓库的 hooks 与 filter，只在受信任的项目里执行
        measure: 未受信任的项目可以读状态，写操作返回 untrusted；受信任后提交照常运行仓库的 hook
        type: automated
        tests:
          - rust:crates/piarc-testkit/tests/sessions/git.rs::status_reads_and_writes_wait_for_trust_and_idle_sessions
          - rust:crates/piarc-git/tests/writes.rs::commits_run_hooks_and_report_identity
      - arch: 网络操作不弹终端或图形凭据提示，不继承带凭据的环境变量，远程地址里的用户信息在日志中脱敏
        measure: 用户模式的环境只加 SSH agent 与代理变量、关闭凭据提示；URL 中的用户信息被脱敏
        type: automated
        tests:
          - rust:crates/piarc-git/src/env.rs::user_mode_adds_agents_and_proxies_only
          - rust:crates/piarc-telemetry/src/redact_tests.rs::secret_named_fields_and_url_passwords_are_replaced
      - arch: 丢失工作的操作（回滚、强制检出、强制推送、删除未合并分支）经主进程原生确认并展示 Core 读到的事实，强制推送只用带期望提交的 `--force-with-lease`，受保护分支不强推
        measure: 只有丢失工作的操作需要原生确认，取消时不发送，确认后带上展示的期望提交；远程动过时推送被拒；受保护分支按整名匹配
        type: automated
        tests:
          - vitest:apps/desktop/src/main/core/git-ipc.test.ts::confirms only operations that lose work
          - vitest:apps/desktop/src/main/core/git-ipc.test.ts::asks natively, sends nothing on cancel and passes the shown lease on confirm
          - rust:crates/piarc-git/tests/writes.rs::pushes_are_rejected_leased_and_pulls_stop_on_conflicts
          - rust:crates/piarc-core/src/git/mod.rs::protected_patterns_match_whole_names
          - l4:apps/desktop/e2e/git-panel.e2e.ts::rolling back asks natively, keeps the bytes and undoes
  - id: THR-16
    title: 浏览器外传与本机服务访问
    countermeasures:
      - arch: 智能体控制的 Space 里每个请求经请求闸门：文档与框架的新主机经 Core 的站点卡并绑定正在运行的那次调用，未获准的子资源被拦截并写进本次结果（ADR-0089）
        measure: 没有运行中的调用时不询问；新主机的文档问一次 Core，本会话的答复覆盖同时等待的主机；未获准的子资源被拦截并进结果；卡片随运行结束撤下
        type: automated
        tests:
          - vitest:apps/desktop/src/main/browser/agent-gate.test.ts::refuses unallowed subresources and records them for the result
          - vitest:apps/desktop/src/main/browser/agent-gate.test.ts::asks Core for a document and keeps a session answer for every waiting host
          - vitest:apps/desktop/src/main/browser/agent-gate.test.ts::refuses a document when Core refuses, and without a run asks nothing
          - vitest:apps/desktop/src/main/browser/agent-gate.test.ts::THR-16 judges a request without page or referrer by every running agent call
          - rust:crates/piarc-core/src/tool_io/policy/tests/browser_site.rs::without_a_running_call_nothing_is_asked
          - rust:crates/piarc-core/src/tool_io/policy/tests/browser_site.rs::the_card_goes_away_with_the_run_and_on_timeout
          - rust:crates/piarc-core/src/tool_io/policy/tests/browser_site.rs::plan_mode_allows_only_local_addresses
          - 'l4:apps/desktop/e2e/browser-agent.e2e.ts::B2.6: the gate blocks what the user did not allow and reports it'
      - arch: 本机端口只放行用户打开过的、本会话进程树监听的与启动配置声明的，PiArc 自己的端口一律拒绝
        measure: 用户打开过的本机端口与会话进程树监听、启动配置声明的端口免卡片，其他本机端口要卡片；浏览器代理拒绝 PiArc 自己的端口
        type: automated
        tests:
          - vitest:apps/desktop/src/main/browser/agent-gate.test.ts::lets local ports the user opened through without a card
          - vitest:apps/desktop/src/main/browser/agent-gate.test.ts::lets the session’s listening and declared ports through and asks for others (B2.6.2)
          - rust:crates/piarc-sandbox/tests/proxy.rs::thr16_a_browser_proxy_refuses_piarc_ports_and_takes_a_new_policy
          - rust:crates/piarc-core/src/browser/proxies.rs::thr16_own_ports_join_the_requested_ones
          - rust:crates/piarc-core/src/ports.rs::thr16_the_ports_of_running_tasks_are_not_piarc_own
          - l4:apps/desktop/e2e/browser-basic.e2e.ts::THR-16 guests send WebRTC and loopback traffic only through the proxy
      - arch: 全部 guest 的网络经 Core 的浏览器代理，协议与链路本地地址在主进程的请求规则里拒绝（ADR-0088）
        measure: 浏览器代理放行公网名，本机与私网地址只在 IP 字面量、localhost 与本地开发名称后可达（防 DNS 重绑定）；请求规则拒绝链路本地与不支持的协议；工作区协议拒绝越界路径，并经 Core 按会话的 Read deny 规则拒绝文件
        type: automated
        tests:
          - rust:crates/piarc-sandbox/tests/proxy.rs::thr16_a_browser_proxy_lets_public_names_through_and_private_ones_only_when_local
          - rust:crates/piarc-sandbox/tests/proxy.rs::thr16_a_browser_proxy_reaches_loopback_only_behind_local_names
          - rust:crates/piarc-sandbox/src/proxy/browser.rs::thr16_private_addresses_need_a_local_name
          - vitest:apps/desktop/src/main/browser/request-rules.test.ts::THR-16 refuses %s (%s)
          - vitest:apps/desktop/src/main/browser/workspace-files.test.ts::THR-16 refuses %s
          - vitest:apps/desktop/src/main/browser/workspace-files.test.ts::THR-16 reads through Core as the browser, so the session’s Read deny rules apply
          - rust:crates/piarc-core/src/tool_io/policy/tests/browser_files.rs::thr16_the_browser_serves_no_workspace_file_a_read_deny_rule_covers
      - arch: 脚本宿主是不能联网的沙箱页面，SDK 只经主进程的 CDP 代理访问本 Space 的标签，页面命令走允许名单（ADR-0091）
        measure: 宿主页面的 CSP 不许连接、宿主分区的请求全部取消；CDP 代理只答本 Space 的目标，允许名单外的方法被拒，并与本次调用到过的主机一起记入审计行
        type: automated
        tests:
          - vitest:apps/desktop/src/main/browser/host-session.test.ts::allows scripts only from the host and no connections
          - vitest:apps/desktop/src/main/browser/cdp-policy.test.ts::answers the Space-scoped Target methods and the version only
          - vitest:apps/desktop/src/main/browser/cdp-proxy.test.ts::refuses methods outside the policy and records them
          - vitest:apps/desktop/src/main/browser/cdp-policy.test.ts::THR-16 refuses dragging local files into a page and page-level Target reach
          - vitest:apps/desktop/src/main/browser/host-bindings.test.ts::keeps each refused method once, bounded in count and length, for the audit row
          - vitest:apps/desktop/src/main/browser/agent-gate.test.ts::records the hosts the run reached for the audit row (B2.7.2)
          - rust:crates/piarc-core/src/tool_io/browser.rs::the_audit_row_lists_refused_methods_and_visited_hosts
          - 'l4:apps/desktop/e2e/browser-agent.e2e.ts::THR-05: the script host reaches nothing on the network'
      - arch: 上传与保存下载经 Core 的读写裁决，工作区外与受保护路径询问，不覆盖已有文件，保存的文件带来自互联网的标记
        measure: 工作区外的上传要卡片、deny 规则拒绝；没有运行中的调用不搬运；保存在手动模式询问、不覆盖、只认本会话的下载；保存与下载的文件带 quarantine 或 Zone.Identifier
        type: automated
        tests:
          - rust:crates/piarc-core/src/tool_io/policy/tests/browser_files.rs::a_file_outside_the_workspace_asks_and_a_deny_rule_refuses
          - rust:crates/piarc-core/src/tool_io/policy/tests/browser_files.rs::nothing_moves_without_a_running_call
          - rust:crates/piarc-core/src/tool_io/policy/tests/browser_files.rs::saving_asks_in_manual_mode_and_never_replaces_a_file
          - vitest:apps/desktop/src/main/browser/quarantine.test.ts::adds the macOS attribute when the download has none
          - vitest:apps/desktop/src/main/browser/quarantine.test.ts::writes the Windows zone stream without credentials or line breaks
          - l4:apps/desktop/e2e/browser-files.e2e.ts::B2.6.6 a download the agent saves asks first and lands in the workspace, quarantined
  - id: THR-17
    title: 浏览器凭据
    countermeasures:
      - arch: 每个工作区一个浏览器分区，与应用窗口和其他工作区的会话数据分开（ADR-0088）
        measure: 标签加载在工作区自己的分区里，没有 preload、拿不到应用的 IPC
        type: automated
        tests:
          - l4:apps/desktop/e2e/browser-basic.e2e.ts::THR-11 guests reach neither the preload nor Node
      - arch: 从 Chrome 导入只在用户逐站勾选并经主进程原生确认后进行，导入的站点在智能体访问时每个会话都经站点卡询问，规则与跳过权限都不放行（ADR-0090）
        measure: 默认不勾任何站点、没有"全部"；取消原生确认不导入；导入的站点及其子域名对智能体是敏感站点，allow 规则与跳过权限都不放行，读不到记录时也按敏感处理
        type: automated
        tests:
          - l4:apps/desktop/e2e/browser-import.e2e.ts::THR-17 imports chosen sites after the native confirmation; the page never sees a value
          - vitest:apps/desktop/src/main/browser/agent-gate-imports.test.ts::THR-17 marks the imported site and its subdomains sensitive, not other sites
          - vitest:apps/desktop/src/main/browser/agent-gate-imports.test.ts::THR-17 counts a host as imported when the records cannot be read
          - rust:crates/piarc-core/src/tool_io/policy/tests/browser_import.rs::thr17_an_allow_rule_does_not_cover_an_imported_site
          - rust:crates/piarc-core/src/tool_io/policy/tests/browser_import.rs::thr17_bypass_permissions_asks_for_an_imported_site
      - arch: 解密后的 cookie 只经 Core 交给主进程写进分区，不进渲染进程与日志，用后清零
        measure: 页面只拿到每站点的条数；值登记到日志脱敏、审计只记站点与条数；密钥不打印字节，明文缓冲用后清零
        type: automated
        tests:
          - 'vitest:apps/desktop/src/main/browser/chrome-import.test.ts::THR-17 the page gets counts only: confirms natively, imports through Core, writes the cookies'
          - rust:crates/piarc-core/src/browser/import.rs::thr17_import_redacts_values_and_audits_sites_and_counts_only
          - rust:crates/piarc-browser-import/src/crypto.rs::thr17_keys_do_not_print_their_bytes
          - rust:crates/piarc-browser-import/src/crypto.rs::thr17_plaintext_buffers_are_zeroized
          - rust:crates/piarc-browser-import/src/import.rs::thr17_macos_v10_import_with_domain_hash_keeps_values_out_of_debug
          - vitest:apps/desktop/src/main/browser/cdp-policy.test.ts::THR-17 keeps cookies out of the network events the script sees
      - arch: Windows 上持久分区的 cookie 由 Chromium 以 DPAPI 保护，沙箱外同一用户的进程能解开
        measure: Windows 上浏览器分区的 cookie 对沙箱外的同用户进程不保密
        type: accepted-risk
        reason: Windows 到 Beta 没有 OS 级沙箱（D7），经批准的命令与同用户进程可以用 DPAPI 解开分区里的 cookie；用户在听过风险后坚持保留导入功能，设置页可按站点移除导入、清除工作区浏览数据或改为退出即清空
        refs: [ADR-0090, ADR-0057]
        tests:
          - 'vitest:apps/desktop/src/main/browser/chrome-import.test.ts::removes a site: its cookies first, then the record'

  - id: THR-18
    title: 麦克风与听写内容
    countermeasures:
      - arch: 麦克风授权只由主进程在用户点击后请求：窗口可见且有近期真实输入，系统拒绝后不再弹出（ADR-0096）
        measure: 页面不能静默开始录音；窗口号取自发送者；拒绝后不再请求
        type: automated
        tests:
          - vitest:apps/desktop/src/main/core/dictation-ipc.test.ts::THR-18 asks for the microphone once and not again after a refusal
          - vitest:apps/desktop/src/main/core/dictation-ipc.test.ts::THR-18 needs recent real input and a visible window
          - vitest:apps/desktop/src/main/core/dictation-ipc.test.ts::THR-18 takes the window id from the sender, never from the page
      - arch: 听写事件只送到发起窗口的路由，其他窗口订阅被拒
        measure: 事件只在 `dictation/<发起窗口>`；其他窗口订阅该路由被主进程拒绝；全应用同一时刻一个听写
        type: automated
        tests:
          - vitest:apps/desktop/src/main/core/dictation-ipc.test.ts::THR-18 lets only the starting window observe its dictation
          - rust:crates/piarc-core/src/dictation/service_tests.rs::thr18_missing_assets_end_the_session_on_its_window_and_free_the_slot
      - arch: Agent Host 及其后代与沙箱内命令的 Seatbelt 配置拒绝麦克风与摄像头，macOS 上只有主程序带 `device.audio-input`
        measure: 真实 `sandbox-exec` 下两份配置的 `sandbox_check` 对 `device-microphone`、`device-camera` 答拒绝；打包产物只有主程序带麦克风 entitlement
        type: automated
        tests:
          - rust:crates/piarc-sandbox/tests/devices.rs::thr18_the_agent_hosts_profile_denies_the_microphone_and_the_camera
          - rust:crates/piarc-sandbox/tests/devices.rs::thr18_the_sandboxed_commands_profile_denies_the_microphone_and_the_camera
          - vitest:scripts/ci/check-app-layout.test.mjs::THR-18 only the main executable adds the microphone to the base list
          - ci:scripts/ci/check-app-layout.mjs
      - arch: 音频只在内存中处理、不写文件，识别文字与词汇不写日志
        measure: 一次完整听写后引擎可写的目录里没有文件、内置资产不变；语音模块没有日志语句；诊断包里的自定义词条只剩条数
        type: automated
        tests:
          - rust:crates/piarc-speech/tests/real_model.rs::thr18_a_session_writes_no_audio_to_disk
          - rust:crates/piarc-telemetry/src/bundle_tests.rs::thr18_dictation_words_leave_the_bundle_as_a_count
      - arch: 未进沙箱的 Bash、hooks 与用户终端继承应用的麦克风授权，作为已接受的风险登记
        measure: 应用之外由用户批准运行的进程可能使用应用的麦克风授权
        type: accepted-risk
        reason: macOS 的 TCC 按负责进程归属授权，PiArc 启动的子进程继承它；放弃责任主体会让每个子进程访问文稿等目录时各自弹框。沙箱内的命令与 Agent Host 已被 Seatbelt 拒绝，剩余的是用户逐条批准或自己运行的进程（用户在 SPEC 评审中确认）
        refs: [ADR-0096]

  - id: THR-19
    title: 语音模型篡改
    countermeasures:
      - arch: 内置的运行库与模型由锁文件固定大小与 SHA-256，打包后的布局检查逐个核对（ADR-0095）
        measure: 打包产物的 `speech/` 与锁文件逐个文件一致，没有多余文件，发布构建没有测试音源
        type: automated
        tests:
          - ci:scripts/ci/check-app-layout.mjs
      - arch: Core 加载前核对大小与 SHA-256，不符时不加载并提示修复（ADR-0094）
        measure: 缺失或损坏的文件被识别，不加载
        type: automated
        tests:
          - rust:crates/piarc-speech/src/models.rs::verification_reports_missing_and_damaged_files
          - rust:crates/piarc-speech/src/models.rs::a_staged_download_that_fails_verification_is_removed
      - arch: 增强模型只从固定修订的 ModelScope 地址经 HTTPS 下载，每一跳检查主机、直连时检查地址，核对大小与 SHA-256 后才启用（ADR-0097）
        measure: 只接受 https 与清单里的主机；直连本地地址被拒；哈希不符或超长的文件删除；经用户代理时只发 CONNECT
        type: automated
        tests:
          - rust:crates/piarc-speech/src/models.rs::enhanced_manifest_parses_and_pins_revisions
          - rust:crates/piarc-web/tests/download.rs::redirects_follow_allowed_hosts_only
          - rust:crates/piarc-web/tests/download.rs::a_direct_connection_to_a_local_address_is_refused
          - rust:crates/piarc-web/tests/download.rs::a_wrong_checksum_or_extra_bytes_remove_the_file
          - rust:crates/piarc-web/tests/download.rs::the_proxy_carries_the_download_through_connect
